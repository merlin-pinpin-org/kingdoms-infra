name: CD

# GitOps deployment (ADR-0007): merge to main auto-deploys the `test`
# environment on the VPS; staging deploys manually via workflow_dispatch;
# production deploys on version tags (vX.Y.Z) with a pinned image.
# Jobs run on the self-hosted runner installed on the VPS
# (docs/VPS-SETUP.md): it checks out the repo and applies the manifests
# locally — no secrets ever leave the VPS.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: test
        type: choice
        options: [test, staging]
  push:
    tags: ["v*.*.*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy test (auto on merge)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, kingdoms]
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy the test stack
        run: ./scripts/deploy.sh test
        env:
          BACKUP_DIR: /opt/kingdoms/backups

  deploy-staging:
    name: Deploy staging (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kingdoms]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the staging stack
        run: ./scripts/deploy.sh staging
        env:
          BACKUP_DIR: /opt/kingdoms/backups

  deploy-prod:
    name: Deploy prod (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, kingdoms]
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Pin the bot image to the released tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "KINGDOMS_BOT_IMAGE=ghcr.io/merlin-pinpin/kingdoms-services:${TAG}" \
            >> "${GITHUB_ENV}"
      - name: Deploy the prod stack
        run: ./scripts/deploy.sh prod
        env:
          BACKUP_DIR: /opt/kingdoms/backups
