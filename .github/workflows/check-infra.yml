name: Check infra

# Runs on every PR: a required status check must report on every pull request,
# or it blocks the merge of PRs it silently skipped (paths filter).

on:
  pull_request:

jobs:
  check:
    name: Validate infrastructure files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifests fail closed without DISCORD_TOKEN
        run: |
          # Environments are data: every directory under envs/ is one.
          shopt -s nullglob
          for manifest in envs/*/docker-compose.yml; do
            env="${manifest#envs/}"
            env="${env%/docker-compose.yml}"
            echo "Checking envs/${env} rejects a missing DISCORD_TOKEN"
            if docker compose -f "${manifest}" config --quiet 2>/dev/null; then
              echo "envs/${env} must fail without DISCORD_TOKEN" >&2
              exit 1
            fi
          done
      - name: Check deploy scripts are executable
        run: |
          for script in .github/workflows/scripts/*.sh; do
            echo "Checking ${script}"
            test -x "${script}"
          done
      - name: Check bot services declare a healthcheck
        run: |
          shopt -s nullglob
          for manifest in envs/*/docker-compose.yml; do
            echo "Checking kingdoms-bot healthcheck in ${manifest}"
            grep -q "healthcheck:" "${manifest}"
            grep -q "healthz" "${manifest}"
          done
      - name: Check every service declares a healthcheck
        run: |
          # ADR-0020 process split (kingdoms-infra#89): a service without a
          # healthcheck would silently bypass the deploy health gate.
          shopt -s nullglob
          for manifest in envs/*/docker-compose.yml; do
            python3 -c 'import sys, yaml; services = yaml.safe_load(open(sys.argv[1]))["services"]; missing = [n for n, s in services.items() if "healthcheck" not in s]; assert not missing, sys.argv[1] + ": services without healthcheck: " + str(missing); print(sys.argv[1] + ": all " + str(len(services)) + " services declare a healthcheck")' "$manifest"
          done
      - name: Check the gRPC processes are on the internal network only
        run: |
          # The gRPC seams never publish to the host: cross-process traffic
          # stays inside the docker network (no public exposure).
          shopt -s nullglob
          for manifest in envs/*/docker-compose.yml; do
            if grep -E '^[[:space:]]+- "[0-9]+:500(51|61|62)"' "${manifest}"; then
              echo "${manifest}: gRPC ports must not be published to the host" >&2
              exit 1
            fi
            echo "${manifest}: no published gRPC ports"
          done
