name: Check infra

# Runs on every PR: a required status check must report on every pull request,
# or it blocks the merge of PRs it silently skipped (paths filter).

on:
  pull_request:

jobs:
  check:
    name: Validate infrastructure files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check env templates exist
        run: |
          for env in test staging prod; do
            echo "Checking deploy/${env}/.env.example"
            test -f "deploy/${env}/.env.example"
          done
      - name: Check deploy scripts are executable
        run: |
          for script in scripts/*.sh; do
            echo "Checking ${script}"
            test -x "${script}"
          done
      - name: Check bot services declare a healthcheck
        run: |
          for env in test staging prod; do
            echo "Checking kingdoms-bot healthcheck in deploy/${env}"
            grep -q "healthcheck:" "deploy/${env}/docker-compose.yml"
            grep -q "healthz" "deploy/${env}/docker-compose.yml"
          done
