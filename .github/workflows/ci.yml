name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh
      - name: Install actionlint
        run: |
          # bash installer from the actionlint releases (checksum-verified
          # by the script itself); it extracts the binary into the given
          # directory, so that directory goes on PATH.
          mkdir -p "$HOME/.local/bin"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest "$HOME/.local/bin"
          "$HOME/.local/bin/actionlint" --version
      - name: Run actionlint
        # The historical startup_failure bugs (matrix in a job-level if,
        # label-list strings in runs-on) were all statically detectable.
        run: actionlint -color

  compose:
    name: Validate compose manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every environment manifest
        run: |
          set -euo pipefail
          # Environments are data: validate all of them, so a new env
          # directory is checked without touching this workflow.
          for manifest in envs/*/docker-compose.yml; do
            echo "Validating ${manifest}"
            DISCORD_TOKEN=ci-placeholder \
            KINGDOMS_BOT_IMAGE=ghcr.io/merlin-pinpin-org/kingdoms-services:sha-ci \
              docker compose -f "${manifest}" config --quiet
          done

  smoke:
    name: Smoke test (test stack boot)
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci-placeholder
      # The test manifest fails closed without a pinned image (ADR-0018):
      # CI boots only mongo/redis, but compose interpolation needs it.
      KINGDOMS_BOT_IMAGE: ghcr.io/merlin-pinpin-org/kingdoms-services:sha-ci
    steps:
      - uses: actions/checkout@v4

      - name: Start the test stack (bot service excluded)
        working-directory: envs/test
        run: |
          docker compose up -d kingdoms-mongo kingdoms-redis

      - name: Wait for MongoDB and Redis healthchecks
        working-directory: envs/test
        run: |
          timeout 90 bash -c "until [ \"\$(docker inspect --format '{{.State.Health.Status}}' \"\$(docker compose ps -q kingdoms-mongo)\")\" = healthy ]; do sleep 3; done"
          timeout 90 bash -c "until [ \"\$(docker inspect --format '{{.State.Health.Status}}' \"\$(docker compose ps -q kingdoms-redis)\")\" = healthy ]; do sleep 3; done"

      - name: Smoke check from a bot-like container
        working-directory: envs/test
        run: |
          mkdir -p /tmp/kingdoms-smoke
          cat > /tmp/kingdoms-smoke/smoke.py <<'PY'
          import os

          import pymongo
          import redis

          mongo_uri = os.environ["MONGO_URI"]
          redis_uri = os.environ["REDIS_URI"]

          client = pymongo.MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          ping = client.admin.command("ping")
          assert ping["ok"] == 1, f"MongoDB ping failed: {ping}"
          print(f"MongoDB ping OK: {mongo_uri}")

          r = redis.Redis.from_url(redis_uri, socket_connect_timeout=5)
          assert r.ping() is True, "Redis ping failed"
          print(f"Redis ping OK: {redis_uri}")

          print("SMOKE TEST PASSED")
          PY

          NETWORK="$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q kingdoms-mongo)")"
          echo "Stack network: ${NETWORK}"
          docker run --rm --network "${NETWORK}" \
            -e MONGO_URI=mongodb://kingdoms-mongo:27017 \
            -e REDIS_URI=redis://kingdoms-redis:6379 \
            -v /tmp/kingdoms-smoke/smoke.py:/smoke.py:ro \
            --entrypoint /bin/bash \
            python:3.12-slim -c 'pip install --quiet --no-input pymongo redis >/dev/null && python /smoke.py'

      - name: Show stack logs on failure
        if: failure()
        working-directory: envs/test
        run: docker compose logs || true

      - name: Tear down the stack
        if: always()
        working-directory: envs/test
        run: docker compose down -v || true

  backup-restore:
    name: Backup/restore round-trip test
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci-placeholder
      # Same as the smoke job: the manifest fails closed without a pinned
      # image (ADR-0018); the round-trip boots mongo/redis only.
      KINGDOMS_BOT_IMAGE: ghcr.io/merlin-pinpin-org/kingdoms-services:sha-ci
    steps:
      - uses: actions/checkout@v4

      - name: Start the test stack (bot service excluded)
        working-directory: envs/test
        run: |
          docker compose up -d kingdoms-mongo kingdoms-redis

      - name: Wait for MongoDB healthcheck
        working-directory: envs/test
        run: |
          timeout 90 bash -c "until [ \"\$(docker inspect --format '{{.State.Health.Status}}' \"\$(docker compose ps -q kingdoms-mongo)\")\" = healthy ]; do sleep 3; done"

      - name: Seed reference data
        working-directory: envs/test
        run: |
          docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms <<'JS'
          db.users.insertMany([
            { _id: "user-1", platform: "discord", display_name: "PlayerOne", rating: 1200 },
            { _id: "user-2", platform: "discord", display_name: "PlayerTwo", rating: 980 },
            { _id: "user-3", platform: "discord", display_name: "PlayerThree", rating: 1050 }
          ])
          db.guilds.insertOne({ _id: "guild-1", locale: "fr", channel_categories: { admin: "123" } })
          JS
          docker compose exec -T kingdoms-redis redis-cli MSET workflow:wf-1:step "ask_name" workflow:wf-2:step "confirm" session:user-1 "abc123"

      - name: Capture reference state (MongoDB and Redis)
        working-directory: envs/test
        run: |
          echo "COUNT=$(docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.users.countDocuments({})')" >> "$GITHUB_ENV"
          docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.users.find().sort({_id:1}).toArray()' > /tmp/reference.json
          docker compose exec -T kingdoms-redis redis-cli --raw MGET workflow:wf-1:step workflow:wf-2:step session:user-1 > /tmp/reference-redis.txt

      - name: Run backup
        env:
          BACKUP_DIR: /tmp/kingdoms-backups
        run: ./scripts/backup_db.sh test /tmp/kingdoms-backups

      - name: Wipe both stores (simulate data loss)
        working-directory: envs/test
        run: |
          docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.dropDatabase()'
          docker compose exec -T kingdoms-redis redis-cli FLUSHALL

      - name: Restore the backup (MongoDB + Redis)
        run: |
          BACKUP_ARCHIVE="$(find /tmp/kingdoms-backups -maxdepth 1 -name 'test-*.archive.gz' -printf '%T@ %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)"
          ./scripts/restore_db.sh test "${BACKUP_ARCHIVE}" --yes

      - name: Verify the restored data matches the reference
        working-directory: envs/test
        run: |
          RESTORED_COUNT="$(docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.users.countDocuments({})')"
          echo "Reference count: ${COUNT}, restored count: ${RESTORED_COUNT}"
          test "${RESTORED_COUNT}" = "${COUNT}"
          docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.users.find().sort({_id:1}).toArray()' > /tmp/restored.json
          diff /tmp/reference.json /tmp/restored.json
          docker compose exec -T kingdoms-redis redis-cli --raw MGET workflow:wf-1:step workflow:wf-2:step session:user-1 > /tmp/restored-redis.txt
          diff /tmp/reference-redis.txt /tmp/restored-redis.txt
          echo "BACKUP/RESTORE ROUND-TRIP OK (MongoDB + Redis)"

      - name: Verify rollback script restores the latest backup
        working-directory: envs/test
        run: |
          docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.users.deleteOne({_id: "user-3"})'
          docker compose exec -T kingdoms-redis redis-cli DEL session:user-1
          BACKUP_DIR=/tmp/kingdoms-backups "${GITHUB_WORKSPACE}/scripts/rollback.sh" test "" --auto
          docker compose exec -T kingdoms-mongo mongosh --quiet kingdoms --eval 'db.users.find().sort({_id:1}).toArray()' > /tmp/after-rollback.json
          diff /tmp/reference.json /tmp/after-rollback.json
          docker compose exec -T kingdoms-redis redis-cli --raw MGET workflow:wf-1:step workflow:wf-2:step session:user-1 > /tmp/after-rollback-redis.txt
          diff /tmp/reference-redis.txt /tmp/after-rollback-redis.txt
          echo "ROLLBACK RESTORE OK (MongoDB + Redis)"

      - name: Show stack logs on failure
        if: failure()
        working-directory: envs/test
        run: docker compose logs || true

      - name: Tear down the stack
        if: always()
        working-directory: envs/test
        run: docker compose down -v || true
