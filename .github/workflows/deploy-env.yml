# Reusable per-environment deployment (ADR-0007, ADR-0018).
#
# Called by deploy.yml (a push to a deploy/<env> state branch, or a
# workflow_dispatch). This is the only place that touches a live
# environment, so every environment deploys through the exact same
# steps: read the pinned state, deploy the stack on the env's runner,
# expose the deployed identity to the bot (/status).
#
# The GitHub environment `environment: <env>` (same name as the env)
# carries the per-env gating: required reviewers (prod-like), secrets
# and variables. The runner is selected by the `env-<name>` label —
# one runner per environment VPS.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (a directory under envs/)"
        required: true
        type: string
      seed_type:
        description: "Optional post-deploy seed (users | ladder-season | empty = none)"
        required: false
        type: string
        default: ""
      seed_guild_id:
        description: "Test guild id for the ladder-season seed (must match the env's TEST_GUILD_ID)"
        required: false
        type: string
        default: ""
      seed_confirm:
        description: "Explicit validation: must equal 'SEED <environment>' or the seed aborts"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # Pull the bot image from ghcr.io/merlin-pinpin-org/kingdoms-services:
  # the package is owned by the kingdoms-services repository, so the
  # anonymous pull from the VPS is unauthorized (the package grants
  # Actions access to this repository — see docs/DEPLOY-TEST-APP.md).
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    # The env-<name> label routes the job to the environment's runner
    # (one runner per environment VPS). The label list must be a JSON array —
    # a comma-joined string, or the raw format() string, would be one literal
    # label no runner carries, and the job would queue forever.
    runs-on: ${{ fromJSON(format('["self-hosted", "kingdoms", "env-{0}"]', inputs.environment)) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out the pinned state
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.environment }}
          # The auto-rollback (rollback.sh --auto) reverts the pin commit on
          # this checkout and pushes it back to the state branch: a shallow
          # clone hides the parent commit and the revert fails.
          fetch-depth: 0
      - name: Compute the deployed infra identity (short sha label)
        id: infra-id
        run: |
          {
            echo "label=deploy/${{ inputs.environment }}@${GITHUB_SHA::7}"
            echo "run_ts=$(date -u +%s)"
            echo "commit_ts=$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (the bot image package is not public)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mint the kingdoms-deployer App token (auto-rollback writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Deploy the stack (image pinned by the state file)
        run: ./scripts/deploy.sh ${{ inputs.environment }}
        env:
          BACKUP_DIR: /opt/kingdoms/backups/${{ inputs.environment }}
          # The failed-health-gate recovery path (rollback.sh --auto) pushes
          # the state revert to deploy/<env> with this token — the same
          # single-writer App as the pin (ADR-0018). On prod the push is
          # rejected by the ruleset and the script falls back to the backup
          # restore with a loud warning.
          ROLLBACK_TOKEN: ${{ steps.app-token.outputs.token }}
          # Environment secrets must be mapped explicitly into the step
          # env: declaring `environment:` alone does not inject them
          # into the shell environment.
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOT_ADMINS: ${{ vars.BOT_ADMINS }}
          MONGO_DB: ${{ vars.MONGO_DB || 'kingdoms' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          # The env's test guild (compose: CICD_GUILD_ID) — the ladder mod
          # scopes its ladders to this guild; without it the mod's register
          # hook fails and the mod stays inactive.
          TEST_GUILD_ID: ${{ vars.TEST_GUILD_ID }}
          # The deploy run links itself in /status (Infra field) so the
          # running bot can point at the exact job that deployed it.
          KINGDOMS_DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KINGDOMS_DEPLOY_RUN_NUMBER: ${{ github.run_number }}
          KINGDOMS_DEPLOY_RUN_TS: ${{ steps.infra-id.outputs.run_ts }}
          # The environment name reaches the bot (announcement env badge,
          # kingdoms-deploy footer, /status) — kingdoms-infra#78 spec 1.
          KINGDOMS_DEPLOY_ENV: ${{ inputs.environment }}
          # The deployed infra state identity (branch@sha -> tree), shown as
          # the Branch/@<sha> lines of the /status Infra field.
          KINGDOMS_DEPLOY_INFRA_LABEL: ${{ steps.infra-id.outputs.label }}
          KINGDOMS_DEPLOY_INFRA_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          # The infra state commit date, distinct from the deploy run date
          # in the announcement (kingdoms-services#109: Committed vs Deployed).
          KINGDOMS_DEPLOY_INFRA_COMMIT_TS: ${{ steps.infra-id.outputs.commit_ts }}
      # ── Post-deploy battery (kingdoms-infra#78) ─────────────────────
      # Read-only, Docker/API only: no test tooling on the env runner.
      # Exit 10 = confirmed P0 (wrong/missing identity) -> auto-rollback.
      # P2 findings (inconclusive) report only — never roll back an
      # unproven state.
      - name: Post-deploy battery (identity + registration checks)
        id: battery
        run: |
          ./scripts/post_deploy_battery.sh ${{ inputs.environment }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      - name: Automatic rollback (confirmed-broken deployment)
        if: failure() && steps.battery.outcome == 'failure'
        run: ./scripts/rollback.sh ${{ inputs.environment }} --auto
        env:
          ROLLBACK_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Battery report
        if: always()
        run: |
          {
            echo "# Post-deploy battery — ${{ inputs.environment }}"
            echo ""
            cat /tmp/battery-report.md 2>/dev/null || echo "_no report produced_"
          } >> "$GITHUB_STEP_SUMMARY"

  journeys:
    # Cross-repo behavioral verification (kingdoms-infra#78 §3): the
    # SimCord journeys of kingdoms-services, run at the pinned commit on
    # an ephemeral GitHub-hosted runner. No environment: (no secrets, no
    # second approval), no concurrency coupling with the deploy group,
    # and zero test tooling on the env VPS. Does not gate the deploy:
    # a behavioral regression is a report problem (P1), not a state
    # problem — the deployment verdict stays with the in-deploy checks.
    name: SimCord journeys (pinned commit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned state
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.environment }}
      - name: Run the journeys at the pinned commit
        run: |
          commit="$(grep -E '^deploy_commit:' envs/${{ inputs.environment }}/state/kingdoms-bot.yml | head -1 | cut -d' ' -f2-)"
          if [ -z "$commit" ]; then
            echo "P2: state file has no deploy_commit — journeys skipped (inconclusive)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone --quiet https://github.com/merlin-pinpin-org/kingdoms-services.git svc
          cd svc
          git checkout "$commit"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --all-extras
          # Hermetic by contract: the journeys are in-memory and
          # network-free; the job fails if that hermeticity regresses.
          uv run pytest tests/integration/test_simcord_journeys.py -q
      - name: Journeys report
        if: always()
        run: |
          {
            echo "## SimCord journeys (pinned commit)"
            echo ""
            echo "Behavioral verification of the deployed source. A failure here is a P1 report (proposed issue), not a rollback."
          } >> "$GITHUB_STEP_SUMMARY"

  post-deploy-seed:
    # Optional seeding at deploy time (kingdoms #seed-on-deploy): the
    # same idempotent CLIs as env-seed.yml, run ON the env runner after
    # the deploy succeeds. Three guards make it explicit by design:
    # 1. an explicit confirmation string (SEED <env>) — a checked box,
    #    never a default;
    # 2. a pre-seed scan that counts what the seed will touch and warns
    #    when the run is destructive (rebound profile links, re-created
    #    ladders/seasons);
    # 3. prod only ever accepts the users seed (the known users import)
    #    — ladder-season/test data on prod aborts before any write.
    name: Post-deploy seed (${{ inputs.seed_type }})
    needs: deploy
    if: needs.deploy.result == 'success' && inputs.seed_type != ''
    runs-on: ${{ fromJSON(format('["self-hosted", "kingdoms", "env-{0}"]', inputs.environment)) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: data-transfer-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out the environment configuration
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.environment }}
      - name: Check out kingdoms-services (seed dumps)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms-services
          ref: main
          path: kingdoms-services
      - name: Validate the seed request (explicit confirmation, prod guard)
        env:
          SEED_TYPE: ${{ inputs.seed_type }}
          SEED_CONFIRM: ${{ inputs.seed_confirm }}
          SEED_GUILD: ${{ inputs.seed_guild_id }}
          ENVIRONMENT: ${{ inputs.environment }}
          ENV_GUILD_ID: ${{ vars.TEST_GUILD_ID }}
        run: |
          expected="SEED ${ENVIRONMENT}"
          if [[ "$SEED_CONFIRM" != "$expected" ]]; then
            echo "::error::seed confirmation mismatch — type exactly '${expected}' in seed_confirm to seed ${ENVIRONMENT}; refusing to seed" >&2
            exit 1
          fi
          case "$SEED_TYPE" in
            users)
              if [[ "$ENVIRONMENT" == "prod" ]]; then
                echo "prod seed: users only — known users import (last import wins)" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            ladder-season)
              if [[ "$ENVIRONMENT" == "prod" ]]; then
                echo "::error::ladder-season seeding is never allowed on prod — prod stays with the known users and the CF ladder on its guild" >&2
                exit 1
              fi
              [[ -n "$SEED_GUILD" ]] || { echo "::error::seed_guild_id is required for ladder-season" >&2; exit 1; }
              env_guild="${ENV_GUILD_ID:-}"
              [[ -n "$env_guild" ]] || { echo "::error::env ${ENVIRONMENT} declares no TEST_GUILD_ID — refusing to seed a ladder season" >&2; exit 1; }
              [[ "$SEED_GUILD" == "$env_guild" ]] || { echo "::error::guild ${SEED_GUILD} is not ${ENVIRONMENT}'s test guild (${env_guild}) — refusing to seed another env's data" >&2; exit 1; }
              ;;
            *)
              echo "::error::unknown seed_type '${SEED_TYPE}' (users | ladder-season)" >&2
              exit 1
              ;;
          esac
      - name: Scan the seed impact (destructive-run warning)
        # Read-only pre-scan: count what the seed will touch so the
        # run summary carries the warning before the write step.
        env:
          SEED_TYPE: ${{ inputs.seed_type }}
          SEED_GUILD: ${{ inputs.seed_guild_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          cd "envs/${ENVIRONMENT}"
          state="state/kingdoms-bot.yml"
          pinned="$(grep -E '^image:' "$state" | head -1 | cut -d' ' -f2-)"
          [[ -n "$pinned" ]] || { echo "ERROR: $state has no pinned image" >&2; exit 1; }
          export KINGDOMS_BOT_IMAGE="$pinned"
          {
            echo "## Seed scan — ${ENVIRONMENT} (${SEED_TYPE})"
            echo ""
            if [[ "$SEED_TYPE" == "users" ]]; then
              echo "The users import is **last-import-wins**: a profile already linked to another Discord account will be rebound to the importing account (the stale link is replaced)."
              echo "Run the seed with that warning acknowledged (the explicit SEED confirmation above covers it)."
            fi
            if [[ "$SEED_TYPE" == "ladder-season" ]]; then
              echo "The ladder-season seed is idempotent (same ids skip) but a changed dataset re-creates the guild's ladder data: matches, rating history and season enrollments are replayed."
              echo "Target guild: ${SEED_GUILD} (validated against the env's TEST_GUILD_ID)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the seed (same CLIs as env-seed.yml)
        env:
          SEED_TYPE: ${{ inputs.seed_type }}
          SEED_GUILD: ${{ inputs.seed_guild_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          cd "envs/${ENVIRONMENT}"
          case "$SEED_TYPE" in
            users)
              users_file="$(ls -1 "${GITHUB_WORKSPACE}"/kingdoms-services/data/core/*-users.csv 2>/dev/null | sort | tail -1)"
              [[ -n "$users_file" ]] || { echo "ERROR: no users dump found — check out kingdoms-services first (seed-on-deploy uses the repo checkout)" >&2; exit 1; }
              docker compose cp "$users_file" kingdoms-core:/tmp/seed-users.csv
              docker compose exec -T kingdoms-core python -m                 kingdoms.core.services.identity_import_cli /tmp/seed-users.csv
              ;;
            ladder-season)
              season_file="$(ls -1 "${GITHUB_WORKSPACE}"/kingdoms-services/data/core/*-season.yaml 2>/dev/null | sort | tail -1)"
              users_file="$(ls -1 "${GITHUB_WORKSPACE}"/kingdoms-services/data/core/*-users.csv 2>/dev/null | sort | tail -1)"
              matches_file="$(ls -1 "${GITHUB_WORKSPACE}"/kingdoms-services/data/mods/ladder/*-matches.csv 2>/dev/null | sort | tail -1)"
              [[ -n "$season_file" && -n "$users_file" && -n "$matches_file" ]] || { echo "ERROR: missing season/users/matches dump" >&2; exit 1; }
              docker compose cp "$season_file" kingdoms-core:/tmp/seed-season.yaml
              docker compose cp "$users_file" kingdoms-core:/tmp/seed-users.csv
              docker compose cp "$matches_file" kingdoms-core:/tmp/seed-matches.csv
              docker compose exec -T kingdoms-core python -m                 kingdoms.mods.ladder.season_import_cli                 /tmp/seed-season.yaml /tmp/seed-users.csv /tmp/seed-matches.csv                 "$SEED_GUILD"
              ;;
          esac
      - name: Seed report
        if: always()
        run: echo "Post-deploy seed (${{ inputs.seed_type }}) applied to ${{ inputs.environment }} — idempotent, re-runnable."
