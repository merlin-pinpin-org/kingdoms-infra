# Reusable per-environment deployment (ADR-0007, ADR-0018).
#
# Called by deploy.yml (a push to a deploy/<env> state branch, or a
# workflow_dispatch). This is the only place that touches a live
# environment, so every environment deploys through the exact same
# steps: read the pinned state, deploy the stack on the env's runner,
# expose the deployed identity to the bot (/status).
#
# The GitHub environment `environment: <env>` (same name as the env)
# carries the per-env gating: required reviewers (prod-like), secrets
# and variables. The runner is selected by the `env-<name>` label —
# one runner per environment VPS.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (a directory under envs/)"
        required: true
        type: string

permissions:
  contents: read
  # Pull the bot image from ghcr.io/merlin-pinpin-org/kingdoms-services:
  # the package is owned by the kingdoms-services repository, so the
  # anonymous pull from the VPS is unauthorized (the package grants
  # Actions access to this repository — see docs/DEPLOY-TEST-APP.md).
  packages: read

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    # The env-<name> label routes the job to the environment's runner
    # (one runner per environment VPS). The label list must be a JSON array —
    # a comma-joined string, or the raw format() string, would be one literal
    # label no runner carries, and the job would queue forever.
    runs-on: ${{ fromJSON(format('["self-hosted", "kingdoms", "env-{0}"]', inputs.environment)) }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out the pinned state
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.environment }}
      - name: Compute the deployed infra identity (short sha label)
        id: infra-id
        run: |
          {
            echo "label=deploy/${{ inputs.environment }}@${GITHUB_SHA::7}"
            echo "run_ts=$(date -u +%s)"
            echo "commit_ts=$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (the bot image package is not public)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Mint the kingdoms-deployer App token (auto-rollback writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Deploy the stack (image pinned by the state file)
        run: ./scripts/deploy.sh ${{ inputs.environment }}
        env:
          BACKUP_DIR: /opt/kingdoms/backups
          # The failed-health-gate recovery path (rollback.sh --auto) pushes
          # the state revert to deploy/<env> with this token — the same
          # single-writer App as the pin (ADR-0018). On prod the push is
          # rejected by the ruleset and the script falls back to the backup
          # restore with a loud warning.
          ROLLBACK_TOKEN: ${{ steps.app-token.outputs.token }}
          # Environment secrets must be mapped explicitly into the step
          # env: declaring `environment:` alone does not inject them
          # into the shell environment.
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOT_ADMINS: ${{ vars.BOT_ADMINS }}
          MONGO_DB: ${{ vars.MONGO_DB || 'kingdoms' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          # The deploy run links itself in /status (Infra field) so the
          # running bot can point at the exact job that deployed it.
          KINGDOMS_DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KINGDOMS_DEPLOY_RUN_NUMBER: ${{ github.run_number }}
          KINGDOMS_DEPLOY_RUN_TS: ${{ steps.infra-id.outputs.run_ts }}
          # The environment name reaches the bot (announcement env badge,
          # kingdoms-deploy footer, /status) — kingdoms-infra#78 spec 1.
          KINGDOMS_DEPLOY_ENV: ${{ inputs.environment }}
          # The deployed infra state identity (branch@sha -> tree), shown as
          # the Branch/@<sha> lines of the /status Infra field.
          KINGDOMS_DEPLOY_INFRA_LABEL: ${{ steps.infra-id.outputs.label }}
          KINGDOMS_DEPLOY_INFRA_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          # The infra state commit date, distinct from the deploy run date
          # in the announcement (kingdoms-services#109: Committed vs Deployed).
          KINGDOMS_DEPLOY_INFRA_COMMIT_TS: ${{ steps.infra-id.outputs.commit_ts }}
