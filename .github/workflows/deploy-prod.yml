# Deploy the `prod` environment (ADR-0007).
# Triggered by any change to the prod configuration on main (deploy/prod/*).
# One dedicated workflow per environment so GitHub policies can gate who
# may trigger it independently of the other environments.

name: Deploy prod

on:
  push:
    branches: [main]
    paths:
      - "deploy/prod/**"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy prod (config change on main)
    runs-on: [self-hosted, kingdoms, env-prod]
    environment: prod
    steps:
      - name: Not implemented yet — create the prod GitHub environment first
        run: |
          echo "::error::The prod deployment is not implemented yet."
          echo ""
          echo "To enable it, create the 'prod' GitHub environment on this"
          echo "repository (Settings → Environments → New environment → prod)"
          echo "and configure the following environment variables/secrets:"
          echo ""
          echo "  Secret:            DISCORD_TOKEN"
          echo "                     → the bot token from the Discord developer portal"
          echo "  Variable:          KINGDOMS_BOT_IMAGE (optional)"
          echo "                     → pinned release image, e.g. ghcr.io/merlin-pinpin/kingdoms-services:v0.1.0"
          echo "                     (deploy/prod/docker-compose.yml also fails closed if unset)"
          echo "  Variable:          MONGO_DB (optional, default: kingdoms)"
          echo "  Variable:          LOG_LEVEL (optional, default: INFO)"
          echo ""
          echo "Deployment to prod also requires the GitHub environment"
          echo "protection rules (required reviewers) and a self-hosted runner"
          echo "carrying the 'env-prod' label."
          exit 1
