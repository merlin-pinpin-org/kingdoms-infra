# Deploy the `prod` environment (ADR-0007).
# Triggered by a version tag (vX.Y.Z) on kingdoms-infra main, or manually by
# an identified production deployer (gated by GitHub rulesets targeting
# this workflow). The bot image is a released image tagged vX.Y.Z
# (KINGDOMS_BOT_IMAGE is required by deploy/prod/docker-compose.yml).
# One dedicated workflow per environment so GitHub policies can gate who
# may trigger it independently of the other environments.

name: Deploy prod

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # Same as deploy-test.yml: the bot image package is owned by the
  # kingdoms-services repository; the pull must be authenticated.
  packages: read

jobs:
  deploy-prod:
    name: Deploy prod (released tag, or manual by a production deployer)
    runs-on: [self-hosted, kingdoms, env-prod]
    environment: prod
    steps:
      - name: Not implemented yet — create the prod GitHub environment first
        run: |
          echo "::error::The prod deployment is not implemented yet."
          echo ""
          echo "To enable it, create the 'prod' GitHub environment on this"
          echo "repository (Settings → Environments → New environment → prod)"
          echo "and configure the following environment variables/secrets:"
          echo ""
          echo "  Secret:     DISCORD_TOKEN"
          echo "              → production bot token from the Discord developer portal"
          echo "  Secret:     BOT_ADMINS"
          echo "              → comma-separated Discord user IDs of the bot operators"
          echo "                (kingdoms-services#35; empty means /status shows none)"
          echo "  Variable:   KINGDOMS_BOT_IMAGE"
          echo "              → released image tag, e.g. ghcr.io/merlin-pinpin-org/kingdoms-services:v0.1.0"
          echo "              (must be a released vX.Y.Z tag; compose fails closed if unset)"
          echo "  Variable:   MONGO_DB (optional, default: kingdoms)"
          echo "  Variable:   LOG_LEVEL (optional, default: INFO)"
          echo "  Variable:   KINGDOMS_DEPLOY_URL (optional)"
          echo "              → released-artifact URL shown by /status, e.g."
          echo "                https://github.com/merlin-pinpin-org/kingdoms-services/releases/tag/v0.1.0"
          echo ""
          echo "Production deployments also require:"
          echo "- GitHub environment protection rules (required reviewers),"
          echo "- a repository ruleset restricting who may run this workflow"
          echo "  (production deployers only),"
          echo "- a self-hosted runner carrying the 'env-prod' label"
          echo "  (one runner per VPS — the prod VPS is not provisioned yet)."
          exit 1
