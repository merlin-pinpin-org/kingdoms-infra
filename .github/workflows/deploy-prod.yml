# Deploy the `prod` environment (ADR-0007). Triggered by pushing a version
# tag (vX.Y.Z); the bot image is pinned to the released tag. A dedicated
# workflow (one per environment) so GitHub policies can gate the
# environments and their deployers independently.
# Jobs run on the self-hosted runner installed on the VPS
# (docs/VPS-SETUP.md): it checks out the repo and applies the manifests
# locally — no secrets ever leave the VPS.

name: Deploy prod

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy prod (tag)
    runs-on: [self-hosted, kingdoms]
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Pin the bot image to the released tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "KINGDOMS_BOT_IMAGE=ghcr.io/merlin-pinpin/kingdoms-services:${TAG}" \
            >> "${GITHUB_ENV}"
      - name: Deploy the prod stack
        run: ./scripts/deploy.sh prod
        env:
          BACKUP_DIR: /opt/kingdoms/backups
