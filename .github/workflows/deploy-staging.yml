# Deploy the `staging` environment (ADR-0007). Manual only: Actions ->
# Deploy staging -> Run workflow. A dedicated workflow (one per environment)
# so GitHub policies can gate who may dispatch it (e.g. staging deployers)
# independently of the other environments.
# Jobs run on the self-hosted runner installed on the VPS
# (docs/VPS-SETUP.md): it checks out the repo and applies the manifests
# locally — no secrets ever leave the VPS.

name: Deploy staging

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging (manual)
    runs-on: [self-hosted, kingdoms]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the staging stack
        run: ./scripts/deploy.sh staging
        env:
          BACKUP_DIR: /opt/kingdoms/backups
