# Deploy the `test` environment (ADR-0007).
# Auto-deploys on every successful CI run of main (merge to main), and can
# be dispatched manually: Actions -> Deploy test -> Run workflow. A
# dedicated workflow (one per environment) so GitHub policies can gate who
# may dispatch it independently of the other environments.
# Jobs run on the self-hosted runner installed on the test VPS
# (docs/VPS-SETUP.md): it checks out the repo and applies the manifests
# locally — no secrets ever leave the VPS.

name: Deploy test

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Deploy test (auto on merge, or manual)
    # Auto only on a successful CI run of main; workflow_dispatch is always
    # manual by definition.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    # env-test: one runner (VPS) per environment; this job deploys
    # on the test VPS.
    runs-on: [self-hosted, kingdoms, env-test]
    environment: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy the test stack
        run: ./scripts/deploy.sh test
        env:
          BACKUP_DIR: /opt/kingdoms/backups
