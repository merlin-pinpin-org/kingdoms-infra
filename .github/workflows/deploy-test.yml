# Deploy the `test` environment (ADR-0007).
# Triggered by:
# - any change to the test configuration on main (deploy/test/*), and
# - the `/deploy-test` PR comment in kingdoms-services, which builds the
#   PR image (tagged with the commit SHA) and dispatches this workflow
#   with it via KINGDOMS_BOT_IMAGE (and the PR link via
#   KINGDOMS_DEPLOY_URL, shown by the bot's /status).
# One dedicated workflow per environment so GitHub policies can gate who
# may trigger it independently of the other environments.
# Jobs run on the self-hosted runner installed on the test VPS
# (docs/VPS-SETUP.md): it checks out the repo and applies the manifests
# locally — no secrets ever leave the VPS.

name: Deploy test

on:
  push:
    branches: [main]
    paths:
      - "deploy/test/**"
      - ".github/workflows/deploy-test.yml"
  workflow_dispatch:
    inputs:
      bot_image:
        description: "Bot image to deploy (commit-SHA tagged; defaults to the manifest)"
        required: false
        default: ""
      deploy_url:
        description: "Deployed artifact URL shown by /status (PR link for a /deploy-test, commit link for main)"
        required: false
        default: ""

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  # Pull the bot image from ghcr.io/merlin-pinpin-org/kingdoms-services:
  # the package is owned by the kingdoms-services repository, so the
  # anonymous pull from the VPS is unauthorized (the package grants
  # Actions access to this repository — see docs/DEPLOY-TEST-APP.md).
  packages: read

jobs:
  deploy-test:
    name: Deploy test (config change on main, or /deploy-test)
    runs-on: [self-hosted, kingdoms, env-test]
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR (the bot image package is not public)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the optional image and deploy-URL overrides from /deploy-test
        if: github.event_name == 'workflow_dispatch' && (inputs.bot_image != '' || inputs.deploy_url != '')
        run: |
          if [ -n "${{ inputs.bot_image }}" ]; then
            echo "KINGDOMS_BOT_IMAGE=${{ inputs.bot_image }}" >> "${GITHUB_ENV}"
          fi
          if [ -n "${{ inputs.deploy_url }}" ]; then
            echo "KINGDOMS_DEPLOY_URL=${{ inputs.deploy_url }}" >> "${GITHUB_ENV}"
          fi
      - name: Deploy the test stack
        run: ./scripts/deploy.sh test
        env:
          BACKUP_DIR: /opt/kingdoms/backups
          # Environment secrets must be mapped explicitly into the step
          # env: declaring `environment: test` alone does not inject them
          # into the shell environment.
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOT_ADMINS: ${{ secrets.BOT_ADMINS }}
          MONGO_DB: ${{ vars.MONGO_DB || 'kingdoms' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
