# Deploy the `test` environment (ADR-0007, ADR-0018).
# Triggered by:
# - a push to the `deploy/test` state branch (envs/test/state/**): the state
#   file pins the exact image and deploy URL; the deploy reads them from
#   the pushed commit (written by the kingdoms-deployer GitHub App from a
#   /deploy-test PR comment, or by the config-change path below), and
# - any change to the test configuration on main (envs/test/**), which
#   must also re-pin the state to the latest sha-<sha> image before deploying.
# One dedicated workflow per environment so GitHub policies can gate who
# may trigger it independently of the other environments.
# Jobs run on the self-hosted runner installed on the test VPS
# (docs/VPS-SETUP.md): it checks out the repo and applies the manifests
# locally — no secrets ever leave the VPS.

name: Deploy test

on:
  push:
    branches:
      - deploy/test
      - main
    paths:
      - "envs/test/state/**"
      - "envs/test/**"
      - ".github/workflows/deploy-test.yml"
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  contents: read
  # Pull the bot image from ghcr.io/merlin-pinpin-org/kingdoms-services:
  # the package is owned by the kingdoms-services repository, so the
  # anonymous pull from the VPS is unauthorized (the package grants
  # Actions access to this repository — see docs/DEPLOY-TEST-APP.md).
  packages: read

jobs:
  repin-state:
    # A test-config change on main must also re-pin the state to the
    # latest sha-<sha> image before deploying (ADR-0018): the pipeline
    # writes the state, the state push triggers the deploy. It shares the
    # deploy-state-<env> concurrency group with pin-state.yml and
    # sync-state.yml: one writer at a time per state branch (single-writer
    # design, ADR-0018).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-state-test
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra
      - name: Re-pin the latest kingdoms-services image via the Pin state workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const svc = "kingdoms-bot";
            const repo = { owner: "merlin-pinpin-org", repo: "kingdoms-services" };
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: "docker.yml", branch: "main", per_page: 1, status: "success",
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed("no successful docker.yml run on main to pin");
              return;
            }
            const sha = runs.data.workflow_runs[0].head_sha;
            // docker/metadata-action publishes type=sha tags as sha-<short> (7
            // chars by default) — pin the tag that exists on GHCR, not the full SHA.
            const short = sha.slice(0, 7);
            const image = `ghcr.io/merlin-pinpin-org/kingdoms-services:sha-${short}`;
            // Delegate the write to the Pin state workflow (single-writer
            // design, ADR-0018): it merges main into the state branch and
            // writes the state in one commit — same path as a /deploy-test.
            // GITHUB_TOKEN would not trigger it (no recursive runs), hence
            // the kingdoms-deployer App token.
            await github.rest.repos.createDispatchEvent({
              owner: "merlin-pinpin-org",
              repo: "kingdoms-infra",
              event_type: "pin-state",
              client_payload: {
                env: "test",
                image,
                version_label: `main@${short}`,
                deploy_url: `https://github.com/merlin-pinpin-org/kingdoms-services/commit/${sha}`,
                deploy_kind: "main",
                deploy_ref: short,
                deploy_tree_url: `https://github.com/merlin-pinpin-org/kingdoms-services/tree/${sha}`,
                deployed_by: `config-change-deploy (run ${context.runId})`,
                source: `test-config change on main (commit ${context.sha.slice(0, 7)})`,
                message: `deploy(test): pin sha-${short} (config change on main)`,
              },
            });
            core.notice(`pin-state dispatched for ${image} (config change on main)`);
  deploy-test:
    name: Deploy test (state-branch push, or manual)
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: [self-hosted, kingdoms, env-test]
    environment: test
    steps:
      - name: Check out the pushed state (or main manifests on dispatch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - name: Compute the deployed infra identity (short sha label)
        id: infra-id
        run: |
          echo "label=deploy/test@${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "run_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR (the bot image package is not public)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the test stack (image pinned by the state file)
        run: ./scripts/deploy.sh test
        env:
          BACKUP_DIR: /opt/kingdoms/backups
          # Environment secrets must be mapped explicitly into the step
          # env: declaring `environment: test` alone does not inject them
          # into the shell environment.
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOT_ADMINS: ${{ vars.BOT_ADMINS }}
          MONGO_DB: ${{ vars.MONGO_DB || 'kingdoms' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
          # The deploy run links itself in /status (Deploy field) so the
          # running bot can point at the exact job that deployed it.
          KINGDOMS_DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KINGDOMS_DEPLOY_RUN_NUMBER: ${{ github.run_number }}
          KINGDOMS_DEPLOY_RUN_TS: ${{ steps.infra-id.outputs.run_ts }}
          # The deployed infra state identity (branch@sha -> tree), shown as
          # the first labeled link of the /status Deploy field.
          KINGDOMS_DEPLOY_INFRA_LABEL: ${{ steps.infra-id.outputs.label }}
          KINGDOMS_DEPLOY_INFRA_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
