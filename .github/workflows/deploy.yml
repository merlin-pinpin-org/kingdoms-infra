# Deploy any environment (ADR-0007, ADR-0018).
#
# ONE workflow for every environment: environments are data (a directory
# under envs/, a `deploy/<env>` state branch, a runner labeled `env-<name>`
# and a GitHub environment whose reviewers gate it), never another
# workflow.
#
# Two paths:
# - a push to a `deploy/<env>` state branch routes to the reusable
#   Deploy environment workflow for that env (deploy-env.yml), which
#   deploys the pinned state;
# - a push to `main` that changes an environment's configuration
#   (envs/<env>/**) re-pins that env to the latest sha-<sha> image via
#   the Pin state workflow (single-writer design, ADR-0018): the pin
#   push then triggers the deploy path above. Prod-like environments are
#   excluded (they pin released vX.Y.Z images only) — they are listed in
#   PROTECTED_ENVS in the re-pin job.
#
# Per-environment gating is GitHub-native, not workflow logic:
# - the GitHub environment (`environment: <env>` in deploy-env.yml)
#   carries the required reviewers — e.g. only the developer/ops
#   approve prod, any collaborator can deploy the test envs;
# - the `deploy/<env>` branch ruleset decides whether a pin needs a
#   PR (prod-like) or not (test-like).
#
# workflow_dispatch deploys a given environment on demand (recovery
# path and manual test-env deploys).
name: Deploy environment
on:
  push:
    branches:
      - main
      - "deploy/*"
    paths:
      - "envs/**"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-env.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (a directory under envs/)"
        required: true
        type: string
      seed_type:
        description: "Optional post-deploy seed (users | ladder-season | empty = none)"
        required: false
        type: string
        default: ""
      seed_guild_id:
        description: "Test guild id for the ladder-season seed (must match the env's TEST_GUILD_ID)"
        required: false
        type: string
        default: ""
      seed_confirm:
        description: "Explicit validation: must equal 'SEED <environment>' or the seed aborts"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # The reusable deploy-env.yml pulls the bot image from GHCR: a reusable
  # workflow may only downgrade the caller's permissions, never elevate
  # them — the caller must grant packages: read or the run dies with a
  # zero-job startup_failure.
  packages: read

jobs:
  route:
    name: Route the deployment
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.route.outputs.env }}
    steps:
      - name: Resolve the target environment
        id: route
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # A push to the deploy/<env> state branch deploys that env.
            echo "env=${GITHUB_REF_NAME#deploy/}" >> "$GITHUB_OUTPUT"
          else
            echo "env=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy the pinned state
    needs: route
    if: needs.route.outputs.env != ''
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: ${{ needs.route.outputs.env }}
      seed_type: ${{ inputs.seed_type }}
      seed_guild_id: ${{ inputs.seed_guild_id }}
      seed_confirm: ${{ inputs.seed_confirm }}
    secrets: inherit

  repin-on-config-change:
    # An environment-config change on main deploys the new manifests with
    # the env's CURRENT pinned image (ADR-0018, amended): the pin may be
    # a release, a pre-release or a PR image — a config change never
    # swaps it. The pin push (Pin state workflow) re-dispatches the exact
    # same image, only the merged manifests move; it shares the
    # deploy-state-<env> concurrency group with pin-state.yml and
    # sync-state.yml (one writer at a time per state branch).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Redeploy every changed environment at its current pin
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // The env keeps whatever image its state branch pins —
            // release, pre-release or PR. A config change on main only
            // moves the manifests; the image identity is preserved.
            const protectedEnvs = ["prod"];
            const { execSync } = require("node:child_process");
            const before = "${{ github.event.before }}";
            const sha = "${{ github.sha }}";
            let changed = new Set();
            try {
              const out = execSync(
                `git diff --name-only ${before} ${sha} -- envs/`,
                { encoding: "utf8" },
              );
              for (const line of out.split("\n").filter(Boolean)) {
                changed.add(line.split("/")[1]);
              }
            } catch (e) {
              core.setFailed(`cannot list the changed files between ${before} and ${sha}: ${e.message}`);
              return;
            }
            const svc = "kingdoms-bot";
            for (const env of [...changed].sort()) {
              if (protectedEnvs.includes(env)) {
                core.info(`${env} is prod-like: config changes reach it through its own release pin`);
                continue;
              }
              // Read the env's CURRENT pin from its state branch and
              // re-dispatch it unchanged (image + identity fields). The
              // Pin state workflow merges the new main manifests in the
              // same commit — the deploy that follows runs the current
              // config with the current image.
              let state;
              try {
                state = execSync(
                  `git show origin/deploy/${env}:envs/${env}/state/kingdoms-bot.yml`,
                  { encoding: "utf8" },
                );
              } catch (e) {
                core.setFailed(`no deploy/${env} state branch to read the pin from: ${e.message}`);
                return;
              }
              const field = (name) =>
                (state.match(new RegExp(`^${name}:\\s*(.*)$`, "m")) || [])[1]?.trim() || "";
              const image = field("image");
              if (!image) {
                core.setFailed(`deploy/${env} carries no pinned image`);
                return;
              }
              const version_label = field("version_label");
              const deploy_url = field("deploy_url");
              const deploy_kind = field("deploy_kind");
              const deploy_ref = field("deploy_ref");
              const deploy_tree_url = field("deploy_tree_url");
              const deploy_branch = field("deploy_branch");
              // Delegate the write to the Pin state workflow (single-writer
              // design, ADR-0018): it merges main into the state branch
              // and writes the state in one commit — same path as a
              // /deploy-test. The client_payload is capped at 10 properties
              // by the GitHub API; message is composed by the Pin state
              // workflow itself.
              await github.rest.repos.createDispatchEvent({
                owner: "merlin-pinpin-org",
                repo: "kingdoms-infra",
                event_type: "pin-state",
                client_payload: {
                  env,
                  image,
                  version_label,
                  deploy_url,
                  deploy_kind,
                  deploy_ref,
                  deploy_tree_url,
                  deploy_branch,
                  deployed_by: `config-change-deploy (run ${context.runId})`,
                  source: `${env}-config change on main (commit ${context.sha.slice(0, 7)}) — image unchanged`,
                },
              });
              core.notice(`pin-state dispatched for ${env}: ${image} unchanged, manifests refreshed`);
            }
            if (changed.size === 0) core.info("no environment configuration changed");
