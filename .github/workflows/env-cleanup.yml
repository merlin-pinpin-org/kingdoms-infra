# One-shot ops repair, v3: recreate the drasah stack cleanly on its
# runner. After the disk-full incidents the compose stack was left in a
# half-recreated state: the bot runs but kingdoms-mongo is gone/down, so
# the bot cannot resolve it and the deploy health gate fails.
# This does exactly what the deploy does (up -d, pinned image from the
# state file) plus --force-recreate --remove-orphans to clear the stale
# containers/network state. Volumes are NEVER touched (no --volumes).
name: Env disk cleanup (ops)

on:
  push:
    branches: [ops/drasah-disk-cleanup]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    name: Reclaim runner disk (diag logs, unused images, build cache)
    runs-on: ["self-hosted", "kingdoms", "env-drasah"]
    timeout-minutes: 15
    steps:
      - name: Purge old runner diag logs first (cheapest, frees worker space)
        run: |
          find /opt/kingdoms/runners -type f -path '*/_diag/*' -mtime +1 -delete 2>/dev/null || true
          find /opt/kingdoms/runners -type f -path '*/_diag/*' -size +10M -delete 2>/dev/null || true

      - name: Disk usage
        run: df -h / || true

      - name: Remove unused images only (in-use images are kept)
        run: docker image prune -af || true

      - name: Remove build cache
        run: docker builder prune -af || true

  recreate:
    name: Recreate the drasah stack (pinned image, force-recreate)
    needs: cleanup
    runs-on: ["self-hosted", "kingdoms", "env-drasah"]
    timeout-minutes: 20
    environment: drasah
    steps:
      - name: Check out the pinned environment state
        uses: actions/checkout@v4
        with:
          ref: deploy/drasah

      - name: Recreate the stack (no volume touch, pinned image, orphans removed)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          cd envs/drasah
          pinned_image="$(grep -E '^image:' state/kingdoms-bot.yml | head -1 | cut -d' ' -f2-)"
          echo "pinned image: ${pinned_image}"
          export KINGDOMS_BOT_IMAGE="${pinned_image}"
          docker compose pull --quiet || true
          docker compose up -d --force-recreate --remove-orphans

      - name: Stack state
        run: docker compose -f envs/drasah/docker-compose.yml ps || true

      - name: Health gate (90s)
        run: |
          deadline=$(( SECONDS + 90 ))
          while (( SECONDS < deadline )); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "healthz OK"; exit 0
            fi
            sleep 5
          done
          echo "::warning::healthz not answering yet — check /logs drasah"
          exit 0
