# One-shot ops cleanup, v2: reclaim disk space on the drasah runner.
# v2 lessons: docker system df as a FIRST step can wedge/hang for a long
# time on a full disk; the first action must be the cheapest one — purge
# old runner _diag logs — so the worker can breathe again. Non-destructive:
# in-use images (any container, running or stopped) are never removed;
# volumes are never touched; the pinned state is never touched.
name: Env disk cleanup (ops)

on:
  push:
    branches: [ops/drasah-disk-cleanup]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    name: Reclaim runner disk (diag logs, unused images, build cache)
    runs-on: ["self-hosted", "kingdoms", "env-drasah"]
    timeout-minutes: 15
    steps:
      - name: Purge old runner diag logs first (cheapest, frees worker space)
        run: |
          find /opt/kingdoms/runners -type f -path '*/_diag/*' -mtime +1 -delete 2>/dev/null || true
          find /opt/kingdoms/runners -type f -path '*/_diag/*' -size +10M -delete 2>/dev/null || true

      - name: Disk usage before
        run: df -h / || true

      - name: Remove unused images only (in-use images are kept)
        run: docker image prune -af || true

      - name: Remove build cache
        run: docker builder prune -af || true

      - name: Disk usage after
        run: |
          df -h / || true
          docker system df || true
