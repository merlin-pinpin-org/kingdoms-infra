# One-shot ops v4: capture the real disk usage of the drasah
# runner and commit it to this ops branch (readable via the API without
# log access). Read-only for the stack: df + docker system df only.
name: Env disk cleanup (ops)

on:
  push:
    branches: [ops/drasah-disk-cleanup]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    name: Reclaim runner disk (diag logs, unused images, build cache)
    runs-on: ["self-hosted", "kingdoms", "env-drasah"]
    timeout-minutes: 15
    steps:
      - name: Purge old runner diag logs first (cheapest, frees worker space)
        run: |
          find /opt/kingdoms/runners -type f -path '*/_diag/*' -mtime +1 -delete 2>/dev/null || true
          find /opt/kingdoms/runners -type f -path '*/_diag/*' -size +10M -delete 2>/dev/null || true

      - name: Remove unused images only (in-use images are kept)
        run: docker image prune -af || true

      - name: Remove build cache
        run: docker builder prune -af || true

      - name: Capture the real disk usage
        run: |
          {
            echo "# drasah runner disk usage — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '## df -h /'
            echo '~~~'
            df -h /
            echo '~~~'
            echo
            echo '## docker system df'
            echo '~~~'
            docker system df || true
            echo '~~~'
          } > /tmp/disk-usage.md

      - name: Check out this ops branch (to commit the report)
        uses: actions/checkout@v4
        with:
          ref: ops/drasah-disk-cleanup

      - name: Commit the report to the ops branch
        run: |
          mkdir -p ops-reports
          cp /tmp/disk-usage.md ops-reports/drasah-disk-usage.md
          git config user.name "kingdoms-deployer[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add ops-reports/drasah-disk-usage.md
          git commit -m "ops: capture drasah runner disk usage report" || echo "nothing to commit"
          git push
