# One-shot ops v5: cancel the zombie run 38018122208 (the cleanup
# v1 wedged on "docker system df" with no timeout, holding the runner's
# job slot until its 6h default timeout). Cancelling is a server-side
# API call — the GITHUB_TOKEN with actions:write may cancel runs of its
# own repository. Minimal job, no runner dependency beyond scheduling.
name: Env disk cleanup (ops)

on:
  push:
    branches: [ops/drasah-disk-cleanup]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  cancel-zombie:
    name: Cancel the wedged cleanup run 38018122208
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel run 38018122208 (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/merlin-pinpin-org/kingdoms-infra/actions/runs/38018122208/cancel             && echo "cancel requested" || echo "already cancelled or not cancellable (ok)"
      - name: Report its status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/merlin-pinpin-org/kingdoms-infra/actions/runs/38018122208 --jq '{status, conclusion}'
