# Dump the logs of a live environment (repository_dispatch: env-logs,
# called by kingdoms-services ops-commands.yml on a /logs PR comment).
# Runs ON the environment's own runner and uploads the dump as a
# PRIVATE workflow artifact; the caller posts the relevant excerpts back
# on the requesting PR/issue. Read-only: never deploys, never pulls,
# never touches the pinned state.
#
# The GitHub `environment:` is declared for its SECRETS (DISCORD_TOKEN is
# an environment secret, needed by the compose substitution) — not as a
# gate: the test environment has no required reviewer, so a read never
# queues. The roster gate (capability env-logs) already decided who may
# read. The run carries the state branch deploy/<env>, allowed by the
# environment deployment branch policy.
name: Environment logs

on:
  repository_dispatch:
    types: [env-logs]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to read logs from (a directory under envs/)"
        required: true
        type: string
      service:
        description: "Service (empty = all)"
        required: false
        type: string
      since:
        description: "Relative window (e.g. 30m, 2h)"
        required: false
        type: string
      from:
        description: "Absolute window start (ISO8601)"
        required: false
        type: string
      to:
        description: "Absolute window end (ISO8601)"
        required: false
        type: string
      tail:
        description: "Last N lines per service"
        required: false
        type: string
        default: "200"

permissions:
  contents: read

concurrency:
  group: env-logs-${{ github.event.client_payload.environment || inputs.environment }}
  cancel-in-progress: false

jobs:
  logs:
    name: Dump logs (${{ github.event.client_payload.environment || inputs.environment }})
    runs-on: ${{ fromJSON(format('["self-hosted", "kingdoms", "env-{0}"]', github.event.client_payload.environment || inputs.environment)) }}
    environment: ${{ github.event.client_payload.environment || inputs.environment }}
    steps:
      - name: Resolve the environment (untrusted input, validated as data)
        id: env
        env:
          PAYLOAD_ENV: ${{ github.event.client_payload.environment || '' }}
          INPUT_ENV: ${{ inputs.environment || '' }}
        run: |
          env_name="${PAYLOAD_ENV:-${INPUT_ENV}}"
          [[ "${env_name}" =~ ^[a-z0-9-]+$ ]] || { echo "::error::invalid environment name"; exit 1; }
          echo "name=${env_name}" >> "$GITHUB_OUTPUT"
      - name: Check out the environment configuration
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ steps.env.outputs.name }}

      - name: Collect the logs
        env:
          ENVIRONMENT: ${{ steps.env.outputs.name }}
          SERVICE: ${{ github.event.client_payload.service || inputs.service || '' }}
          SINCE: ${{ github.event.client_payload.since || inputs.since || '' }}
          FROM: ${{ github.event.client_payload.from || inputs.from || '' }}
          TO: ${{ github.event.client_payload.to || inputs.to || '' }}
          TAIL: ${{ github.event.client_payload.tail || inputs.tail || '200' }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          ARGS=("${ENVIRONMENT}")
          [[ -n "${SERVICE}" ]] && ARGS+=(--service "${SERVICE}")
          [[ -n "${SINCE}" ]]  && ARGS+=(--since "${SINCE}")
          [[ -n "${FROM}" ]]   && ARGS+=(--from "${FROM}")
          [[ -n "${TO}" ]]     && ARGS+=(--to "${TO}")
          ARGS+=(--tail "${TAIL}")
          mkdir -p /tmp/envlogs
          ./scripts/envlogs.sh "${ARGS[@]}" | tee /tmp/envlogs/logs.txt
          # Hard ceiling: a runaway dump must not eat the artifact store;
          # the full dump also lands in the run log, viewable on GitHub.
          MAX_BYTES=$(( 10 * 1024 * 1024 ))
          SIZE=$(stat -c%s /tmp/envlogs/logs.txt || echo 0)
          if (( SIZE > MAX_BYTES )); then
            head -c "${MAX_BYTES}" /tmp/envlogs/logs.txt > /tmp/envlogs/logs.truncated.txt
            mv /tmp/envlogs/logs.truncated.txt /tmp/envlogs/logs.txt
            echo "::warning::log dump truncated to 10 MB (${SIZE} bytes collected — narrow the window)"
          fi

      - name: Upload the dump (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: env-logs-${{ github.event.client_payload.environment || inputs.environment }}-${{ github.run_id }}
          path: /tmp/envlogs/logs.txt
          retention-days: 90
