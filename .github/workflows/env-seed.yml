# Seed an environment's data from a source file (/seed ops command).
# workflow_dispatch only (called by the kingdoms-services ops-commands
# router with the kingdoms-deployer App token), running ON the target
# environment's runner (label env-<name>): the seeding CLIs execute
# inside the env's kingdoms-core container — the only place where the
# code and the Mongo network are both available (#138 execution model).
#
# Types (each maps to one existing, idempotent CLI):
#   users         — data/core/<file>.csv      via identity_import_cli (core identity import)
#   ladder-season — full ladder season seed via season_import_cli: creates the
#                   guild's ladder (ladder-<game>-<guild>) and its indexed
#                   season, then imports the users and matches (guild-scoped,
#                   fail-closed against the env's TEST_GUILD_ID)
#   season        — data/core/<file>.yaml     via seed_cli_yaml
#   test-season   — synthetic dataset generated then imported (never prod)
#   game-content  — localized faction/map content from the vendored aoe2techtree
#                   dataset via content_refresh_cli: creates the missing catalog
#                   civs then upserts the FR/EN content docs (idempotent)
name: Seed environment data
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to seed (a directory under envs/)"
        required: true
        type: string
      type:
        description: "Seed type (which CLI runs)"
        required: true
        type: choice
        options: [users, ladder-season, season, test-season, game-content]
      file:
        description: "Source file path relative to kingdoms-services/ (empty = latest dump for the type)"
        required: false
        type: string
      ladder_id:
        description: "Ladder id / owner_ref (required for season, test-season)"
        required: false
        type: string
      guild_id:
        description: "Test guild id whose ladder to seed (required for ladder-season; must match the env's TEST_GUILD_ID)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-transfer-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed ${{ inputs.type }} (${{ inputs.environment }})
    runs-on: ${{ fromJSON(format('["self-hosted", "kingdoms", "env-{0}"]', inputs.environment)) }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the environment configuration
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.environment }}
      - name: Check out kingdoms-services (CLIs and data dumps)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms-services
          ref: main
          path: kingdoms-services
      - name: Fail closed on synthetic data in prod
        if: inputs.environment == 'prod' && inputs.type == 'test-season'
        run: |
          echo "::error::test-season (synthetic data) is never allowed in prod"
          exit 1

      - name: Resolve the source file
        env:
          SEED_TYPE: ${{ inputs.type }}
          SEED_FILE: ${{ inputs.file }}
        run: |
          case "$SEED_TYPE" in
            users)   data_dir="kingdoms-services/data/core";        prefix="users" ;;
            ladder-season) data_dir="kingdoms-services/data/core";  prefix="season" ;;
            season)  data_dir="kingdoms-services/data/core";        prefix="season" ;;
            test-season) data_dir=""; prefix="" ;;
            game-content) data_dir=""; prefix="" ;;
          esac
          if [[ "$SEED_TYPE" == "game-content" ]]; then
            echo "data_file=game-content" >> "$GITHUB_ENV"
          fi
          if [[ "$SEED_TYPE" == "test-season" || "$SEED_TYPE" == "game-content" ]]; then
            echo "data_file=$SEED_TYPE" >> "$GITHUB_ENV"
          elif [[ -n "$SEED_FILE" ]]; then
            [[ -f "$data_dir/$SEED_FILE" ]] || { echo "ERROR: $data_dir/$SEED_FILE not found" >&2; exit 1; }
            echo "data_file=$SEED_FILE" >> "$GITHUB_ENV"
          else
            file=""
            for candidate in "$data_dir"/*-"$prefix".*; do
              base="${candidate##*/}"
              [[ "$base" =~ ^[0-9]+T[0-9]+Z- ]] || continue
              case "$SEED_TYPE" in
                users)          [[ "$candidate" == *.csv ]] ;;
                ladder-season|season) [[ "$candidate" == *.yaml ]] ;;
              esac || continue
              [[ -z "$file" || "$candidate" > "$file" ]] && file="$candidate"
            done
            file="${file#"$data_dir/"}"
            [[ -n "$file" ]] || { echo "ERROR: no $prefix dump in $data_dir" >&2; exit 1; }
            echo "data_file=$file" >> "$GITHUB_ENV"
          fi
          echo "data_dir=$data_dir" >> "$GITHUB_ENV"
      - name: Resolve the pinned image from the state file
        # Compose interpolation fails closed on a missing
        # KINGDOMS_BOT_IMAGE (same as deploy.sh): export the pinned image
        # so any docker compose command in this workflow targets the
        # deployed stack.
        run: |
          state="envs/${{ inputs.environment }}/state/kingdoms-bot.yml"
          pinned="$(grep -E '^image:' "$state" | head -1 | cut -d' ' -f2-)"
          [[ -n "$pinned" ]] || { echo "ERROR: $state has no pinned image" >&2; exit 1; }
          echo "KINGDOMS_BOT_IMAGE=$pinned" >> "$GITHUB_ENV"
      - name: Run the seed CLI in the env container
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SEED_TYPE: ${{ inputs.type }}
          LADDER_ID: ${{ inputs.ladder_id }}
          GUILD_ID: ${{ inputs.guild_id }}
          ENV_GUILD_ID: ${{ vars.TEST_GUILD_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          cd "envs/${ENVIRONMENT}"
          case "$SEED_TYPE" in
            users)
              docker compose cp "${GITHUB_WORKSPACE}/${{ env.data_dir }}/${{ env.data_file }}" kingdoms-core:/tmp/seed.csv
              docker compose exec -T kingdoms-core python -m \
                kingdoms.core.services.identity_import_cli \
                /tmp/seed.csv
              ;;
            ladder-season)
              # Guild-scoped, fail-closed: the ladder lives in the env's test
              # guild (ladder-<game>-<guild_id>) and its seasons carry an
              # incremental index. A missing guild, or one that is not this
              # environment's declared TEST_GUILD_ID, aborts the seed before
              # touching any data — a guildless run must never fall back to
              # another env's or prod's data.
              [[ -n "$GUILD_ID" ]] || { echo "ERROR: guild_id is required for ladder-season — pass the test guild whose ladder to seed (/seed <env> ladder-season [file] <guild_id>)" >&2; exit 1; }
              env_guild="${ENV_GUILD_ID:-}"
              [[ -n "$env_guild" ]] || { echo "ERROR: env ${ENVIRONMENT} declares no TEST_GUILD_ID (GitHub environment variable) — add it before seeding a ladder season; refusing to seed without the env's guild, this guards against seeding the wrong env (e.g. prod)" >&2; exit 1; }
              [[ "$GUILD_ID" == "$env_guild" ]] || { echo "ERROR: guild ${GUILD_ID} is not ${ENVIRONMENT}'s test guild (${env_guild}) — each env only seeds its own guild's ladder; refusing to seed another env's or prod's data" >&2; exit 1; }
              season_file="${GITHUB_WORKSPACE}/${{ env.data_dir }}/${{ env.data_file }}"
              users_file="$(ls -1 "${GITHUB_WORKSPACE}/kingdoms-services/data/core/"*-users.csv 2>/dev/null | sort | tail -1)"
              matches_file="$(ls -1 "${GITHUB_WORKSPACE}/kingdoms-services/data/mods/ladder/"*-matches.csv 2>/dev/null | sort | tail -1)"
              [[ -n "$users_file" && -n "$matches_file" ]] || { echo "ERROR: no users or matches dump found for the ladder-season seed" >&2; exit 1; }
              docker compose cp "$season_file" kingdoms-core:/tmp/seed-season.yaml
              docker compose cp "$users_file" kingdoms-core:/tmp/seed-users.csv
              docker compose cp "$matches_file" kingdoms-core:/tmp/seed-matches.csv
              docker compose exec -T kingdoms-core python -m \
                kingdoms.mods.ladder.season_import_cli \
                /tmp/seed-season.yaml /tmp/seed-users.csv /tmp/seed-matches.csv \
                "$GUILD_ID"
              ;;
            season)
              docker compose cp "${GITHUB_WORKSPACE}/${{ env.data_dir }}/${{ env.data_file }}" kingdoms-core:/tmp/seed.yaml
              docker compose exec -T kingdoms-core python -m \
                kingdoms.core.games.aoe2.seed_cli_yaml \
                /tmp/seed.yaml "$LADDER_ID"
              ;;
            game-content)
              # Catalog + localized content refresh from the vendored dataset
              # (aoe2techtree, MIT + Microsoft Game Content Usage Rules):
              # creates the missing civs, upserts the FR/EN content docs.
              # Idempotent; safe on any env including prod.
              docker compose exec -T kingdoms-core python -m \
                kingdoms.core.games.aoe2.content_refresh_cli
              ;;
            test-season)
              [[ -n "$LADDER_ID" ]] || { echo "ERROR: ladder_id (owner_ref) is required for test-season" >&2; exit 1; }
              python3 kingdoms-services/scripts/generate_test_data.py /tmp/kingdoms-test-data
              for f in test-season.yaml test-users.csv test-matches.csv; do
                docker compose cp "/tmp/kingdoms-test-data/$f" "kingdoms-core:/tmp/$f"
              done
              docker compose exec -T kingdoms-core python -m \
                kingdoms.mods.ladder.season_import_cli \
                /tmp/test-season.yaml /tmp/test-users.csv /tmp/test-matches.csv \
                "$LADDER_ID"
              ;;
          esac
      - name: Report
        if: always()
        run: echo "Seed ${{ inputs.type }} (${{ env.data_file }}) applied to ${{ inputs.environment }} — idempotent, re-runnable."
