# Seed an environment's data from a source file (/seed ops command).
# workflow_dispatch only (called by the kingdoms-services ops-commands
# router with the kingdoms-deployer App token), running ON the target
# environment's runner (label env-<name>): the seeding CLIs execute
# inside the env's kingdoms-core container — the only place where the
# code and the Mongo network are both available (#138 execution model).
#
# Types (each maps to one existing, idempotent CLI):
#   users        — data/core/<file>.csv      via profile_links_import_cli (core identity import)
#   matches      — data/mods/ladder/<file>.csv via legacy_import_cli
#   season       — data/core/<file>.yaml     via seed_cli_yaml
#   test-season  — synthetic dataset generated then imported (never prod)
name: Seed environment data
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to seed (a directory under envs/)"
        required: true
        type: string
      type:
        description: "Seed type (which CLI runs)"
        required: true
        type: choice
        options: [users, matches, season, test-season]
      file:
        description: "Source file path relative to kingdoms-services/ (empty = latest dump for the type)"
        required: false
        type: string
      ladder_id:
        description: "Ladder id / owner_ref (required for matches, season, test-season)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-transfer-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed ${{ inputs.type }} (${{ inputs.environment }})
    runs-on: ${{ fromJSON(format('["self-hosted", "kingdoms", "env-{0}"]', inputs.environment)) }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out the environment configuration
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ inputs.environment }}
      - name: Check out kingdoms-services (CLIs and data dumps)
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms-services
          ref: main
          path: kingdoms-services
      - name: Fail closed on synthetic data in prod
        if: inputs.environment == 'prod' && inputs.type == 'test-season'
        run: |
          echo "::error::test-season (synthetic data) is never allowed in prod"
          exit 1

      - name: Resolve the source file
        env:
          SEED_TYPE: ${{ inputs.type }}
          SEED_FILE: ${{ inputs.file }}
        run: |
          case "$SEED_TYPE" in
            users)   data_dir="kingdoms-services/data/core";        prefix="users" ;;
            matches) data_dir="kingdoms-services/data/mods/ladder"; prefix="matches" ;;
            season)  data_dir="kingdoms-services/data/core";        prefix="season" ;;
            test-season) data_dir=""; prefix="" ;;
          esac
          if [[ "$SEED_TYPE" == "test-season" ]]; then
            echo "data_file=test-season" >> "$GITHUB_ENV"
          elif [[ -n "$SEED_FILE" ]]; then
            [[ -f "$data_dir/$SEED_FILE" ]] || { echo "ERROR: $data_dir/$SEED_FILE not found" >&2; exit 1; }
            echo "data_file=$SEED_FILE" >> "$GITHUB_ENV"
          else
            file=""
            for candidate in "$data_dir"/*-"$prefix".*; do
              [[ "$candidate" =~ ^[0-9]+T[0-9]+Z- ]] || continue
              case "$SEED_TYPE" in
                users|matches) [[ "$candidate" == *.csv ]] ;;
                season)        [[ "$candidate" == *.yaml ]] ;;
              esac || continue
              [[ -z "$file" || "$candidate" > "$file" ]] && file="$candidate"
            done
            file="${file#"$data_dir/"}"
            [[ -n "$file" ]] || { echo "ERROR: no $prefix dump in $data_dir" >&2; exit 1; }
            echo "data_file=$file" >> "$GITHUB_ENV"
          fi
          echo "data_dir=$data_dir" >> "$GITHUB_ENV"
      - name: Resolve the pinned image from the state file
        # Compose interpolation fails closed on a missing
        # KINGDOMS_BOT_IMAGE (same as deploy.sh): export the pinned image
        # so any docker compose command in this workflow targets the
        # deployed stack.
        run: |
          state="envs/${{ inputs.environment }}/state/kingdoms-bot.yml"
          pinned="$(grep -E '^image:' "$state" | head -1 | cut -d' ' -f2-)"
          [[ -n "$pinned" ]] || { echo "ERROR: $state has no pinned image" >&2; exit 1; }
          echo "KINGDOMS_BOT_IMAGE=$pinned" >> "$GITHUB_ENV"
      - name: Run the seed CLI in the env container
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SEED_TYPE: ${{ inputs.type }}
          LADDER_ID: ${{ inputs.ladder_id }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          cd "envs/${ENVIRONMENT}"
          case "$SEED_TYPE" in
            users)
              docker compose cp "${GITHUB_WORKSPACE}/${{ env.data_dir }}/${{ env.data_file }}" kingdoms-core:/tmp/seed.csv
              docker compose exec -T kingdoms-core python -m \
                kingdoms.mods.ladder.profile_links_import_cli \
                /tmp/seed.csv
              ;;
            matches)
              [[ -n "$LADDER_ID" ]] || { echo "ERROR: ladder_id is required for matches" >&2; exit 1; }
              docker compose cp "${GITHUB_WORKSPACE}/${{ env.data_dir }}/${{ env.data_file }}" kingdoms-core:/tmp/seed.csv
              docker compose exec -T kingdoms-core python -m \
                kingdoms.mods.ladder.legacy_import_cli \
                "$LADDER_ID" /tmp/seed.csv
              ;;
            season)
              docker compose cp "${GITHUB_WORKSPACE}/${{ env.data_dir }}/${{ env.data_file }}" kingdoms-core:/tmp/seed.yaml
              docker compose exec -T kingdoms-core python -m \
                kingdoms.core.games.aoe2.seed_cli_yaml \
                /tmp/seed.yaml "$LADDER_ID"
              ;;
            test-season)
              [[ -n "$LADDER_ID" ]] || { echo "ERROR: ladder_id (owner_ref) is required for test-season" >&2; exit 1; }
              python3 kingdoms-services/scripts/generate_test_data.py /tmp/kingdoms-test-data
              for f in test-season.yaml test-users.csv test-matches.csv; do
                docker compose cp "/tmp/kingdoms-test-data/$f" "kingdoms-core:/tmp/$f"
              done
              docker compose exec -T kingdoms-core python -m \
                kingdoms.mods.ladder.season_import_cli \
                /tmp/test-season.yaml /tmp/test-users.csv /tmp/test-matches.csv \
                "$LADDER_ID"
              ;;
          esac
      - name: Report
        if: always()
        run: echo "Seed ${{ inputs.type }} (${{ env.data_file }}) applied to ${{ inputs.environment }} — idempotent, re-runnable."
