# Pin the desired state on a deploy/<env> state branch (ADR-0018).
#
# Single-writer design: ALL writers to a deploy/<env> state branch live in
# this repository and share one concurrency group, deploy-state-<env>, so
# GitHub itself serializes them — a pin can never race a sync (the
# historical "cannot lock ref" failure). The pin is triggered by a
# repository_dispatch from a deploy pipeline (e.g. the /deploy-test
# workflow of kingdoms-services, authenticated as the kingdoms-deployer
# App, whose token is the only non-admin actor allowed to write the state
# branches); the client passes the whole state as client_payload, so the
# pinned values cannot drift from what the pipeline built.
#
# The pin also merges origin/main into the state branch and pushes the
# merge and the pin together: every deployment carries the current
# manifests, workflows and scripts — no separate sync can lose a race
# against it (they share the concurrency group anyway). The sync-state
# workflow remains the catch-up path for infra-only changes.
#
# Adding an environment is adding it to the matrix (plus its ruleset and
# VPS install); the dispatch is ignored for unknown environments.

name: Pin state

on:
  repository_dispatch:
    types: [pin-state]

permissions:
  contents: write

jobs:
  pin:
    name: Pin deploy/${{ matrix.env }} state
    if: github.event.client_payload.env == matrix.env
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-state-${{ matrix.env }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        env: [test, prod]
    steps:
      - name: Refuse incomplete state payloads
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          for field in image version_label deploy_kind deploy_ref deploy_tree_url; do
            value="$(jq -r --arg f "$field" '.[$f] // empty' <<<"$PAYLOAD")"
            if [[ -z "$value" ]]; then
              echo "::error::the pin-state dispatch payload is missing the '$field' field"
              exit 1
            fi
          done
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra
      - name: Configure git
        run: |
          git config --global user.name "kingdoms-deployer[bot]"
          git config --global user.email "noreply@merlin-pinpin.org"
      - uses: actions/checkout@v4
        with:
          ref: deploy/${{ matrix.env }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge origin/main, write the pinned state, push
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          env_name="${{ matrix.env }}"
          git remote set-branches origin '*'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "deploy/${env_name} already contains main — no merge needed."
          else
            git merge origin/main --no-edit -m "deploy(${env_name}): sync state branch with main"
          fi
          state_file="deploy/state/${env_name}/kingdoms-bot.yml"
          [[ -f "$state_file" ]] || { echo "::error::state file ${state_file} missing on deploy/${env_name}" >&2; exit 1; }
          field() { jq -r --arg f "$1" '.[$f] // ""' <<<"$PAYLOAD"; }
          message="$(field message)"
          [[ -n "$message" ]] || message="deploy(${env_name}): pin $(field version_label)"
          {
            echo "# Desired state of kingdoms-bot on the ${env_name} environment (ADR-0018)."
            echo "# Written by the deploy pipelines only (kingdoms-deployer GitHub App);"
            echo "# a push to this branch deploys this exact image."
            echo "image: $(field image)"
            echo "version_label: $(field version_label)"
            echo "deploy_url: $(field deploy_url)"
            echo "deploy_kind: $(field deploy_kind)"
            echo "deploy_ref: $(field deploy_ref)"
            echo "deploy_tree_url: $(field deploy_tree_url)"
            echo "deploy_ts: $(date -u +%s)"
            echo "deployed_by: $(field deployed_by)"
            echo "deployed_at: \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "source: $(field source)"
          } > "$state_file"
          git add "$state_file"
          git commit -m "$message"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/merlin-pinpin-org/kingdoms-infra.git"
          git push origin HEAD:deploy/${env_name}
          echo "state pinned on deploy/${env_name}: $(field image)"
