# Pin the desired state on a deploy/<env> state branch (ADR-0018).
#
# Single-writer design: ALL writers to a deploy/<env> state branch live in
# this repository and share one concurrency group, deploy-state-<env>, so
# GitHub itself serializes them \u2014 a pin can never race a sync (the
# historical "cannot lock ref" failure). The pin is triggered by a
# repository_dispatch from a deploy pipeline (e.g. the /deploy-test
# workflow of kingdoms-services, authenticated as the kingdoms-deployer
# App, whose token is the only non-admin actor allowed to write the state
# branches); the client passes the whole state as client_payload, so the
# pinned values cannot drift from what the pipeline built.
#
# The pin also merges origin/main into the state branch in the same commit
# when main has moved: every deployment carries the current manifests,
# workflows and scripts \u2014 no separate sync can lose a race against it
# (they share the concurrency group anyway). The sync-state workflow
# remains the catch-up path for infra-only changes.
#
# Adding an environment is adding it to the matrix (plus its ruleset and
# VPS install); the dispatch is ignored for unknown environments.

name: Pin state

on:
  repository_dispatch:
    types: [pin-state]

permissions:
  contents: write

jobs:
  pin:
    name: Pin deploy/${{ matrix.env }} state
    if: github.event.client_payload.env == matrix.env
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-state-${{ matrix.env }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        env: [test, prod]
    steps:
      - name: Refuse incomplete state payloads
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          for field in image version_label deploy_kind deploy_ref deploy_tree_url deploy_ts; do
            value="$(jq -r --arg f "$field" '.[$f] // empty' <<<"$PAYLOAD")"
            if [[ -z "$value" ]]; then
              echo "::error::the pin-state dispatch payload is missing the '$field' field"
              exit 1
            fi
          done
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra
      - name: Configure git
        run: |
          git config --global user.name "kingdoms-deployer[bot]"
          git config --global user.email "noreply@merlin-pinpin.org"
      - uses: actions/checkout@v4
        with:
          ref: deploy/${{ matrix.env }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge origin/main into the state branch
        run: |
          set -euo pipefail
          git remote set-branches origin '*'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "deploy/${{ matrix.env }} already contains main \u2014 no merge needed."
          else
            git merge origin/main --no-edit -m "deploy(${{ matrix.env }}): sync state branch with main"
          fi
      - name: Write the pinned state and push
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const p = context.payload.client_payload;
            const svc = "kingdoms-bot";
            const path = `deploy/state/${p.env}/${svc}.yml`;
            const branch = `deploy/${p.env}`;
            let base;
            try {
              base = (await github.rest.repos.getContent({
                owner: "merlin-pinpin-org", repo: "kingdoms-infra", path, ref: branch,
              })).data;
            } catch (e) {
              core.setFailed(`state file ${path} missing on ${branch}`);
              return;
            }
            const state = [
              `# Desired state of kingdoms-bot on the ${p.env} environment (ADR-0018).`,
              "# Written by the deploy pipelines only (kingdoms-deployer GitHub App);",
              "# a push to this branch deploys this exact image.",
              `image: ${p.image}`,
              `version_label: ${p.version_label}`,
              `deploy_url: ${p.deploy_url || ""}`,
              `deploy_kind: ${p.deploy_kind}`,
              `deploy_ref: ${p.deploy_ref}`,
              `deploy_tree_url: ${p.deploy_tree_url}`,
              `deploy_ts: ${p.deploy_ts}`,
              `deployed_by: ${p.deployed_by || `pin-state (run ${context.runId})`}`,
              `deployed_at: "${new Date().toISOString()}"`,
              `source: ${p.source || ""}`,
              ""].join("\n");
            const commit = await github.rest.repos.createOrUpdateFileContents({
              owner: "merlin-pinpin-org", repo: "kingdoms-infra",
              path, branch,
              message: p.message || `deploy(${p.env}): pin ${p.version_label}`,
              content: Buffer.from(state).toString("base64"),
              sha: base.sha,
            });
            core.notice(`state pinned on ${branch}: ${p.image}`);
            core.setOutput("state_sha", commit.data.commit.sha);
