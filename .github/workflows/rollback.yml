# Revert the pinned state on a deploy/<env> branch (ADR-0018).
#
# The smart rollback: a failed or rejected deployment rolls the PINNED
# STATE back — never the code on main, never another repository. The
# previous known-good image is restored by pushing a revert of the last
# pin commit to the state branch; the push itself re-triggers the Deploy
# environment workflow, which re-applies the previous image through the
# normal path.
#
# Two triggers:
# - repository_dispatch (rollback-state): called by the post-deploy
#   battery (kingdoms-infra#78) when it confirms the deployment is
#   broken (identity mismatch, unhealthy stack);
# - workflow_dispatch (env + reason): the manual recovery path.
#
# Branch protection decides the delivery, not this workflow:
# - deploy/test accepts a direct push from the kingdoms-deployer App
#   (the "Deploy TEST" ruleset has no pull_request rule);
# - deploy/prod requires an approved PR (the "Deploy PROD" ruleset), so
#   the revert lands as a pull request assigned for review — a human
#   merges it. The workflow never bypasses the ruleset.
name: Rollback state

on:
  repository_dispatch:
    types: [rollback-state]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back (a directory under envs/)"
        required: true
        type: string
      reason:
        description: "Why (shown in the revert commit and PR)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-state-${{ github.event.client_payload.env || inputs.environment }}
  cancel-in-progress: false

jobs:
  revert:
    name: Revert the pin on deploy/<env>
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate the environment
        env:
          PAYLOAD_ENV: ${{ github.event.client_payload.env }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          env_name="${PAYLOAD_ENV:-${INPUT_ENV}}"
          case "${env_name}" in
            test|prod) echo "env_name=${env_name}" >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown environment '${env_name}'"; exit 1 ;;
          esac

      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra

      - name: Check out the state branch
        uses: actions/checkout@v4
        with:
          ref: deploy/${{ env.env_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revert the last pin commit
        env:
          REASON: ${{ github.event.client_payload.reason || inputs.reason }}
        run: |
          set -euo pipefail
          reason="${REASON:-post-deploy battery reported a broken deployment}"
          pin_sha="$(git rev-parse HEAD)"
          if ! git show -s --format=%P HEAD | grep -q ' '; then
            echo "::error::deploy/${{ env.env_name }} HEAD ${pin_sha} has no parent commit — nothing to revert to"
            exit 1
          fi
          git config --global user.name "kingdoms-deployer[bot]"
          git config --global user.email "noreply@merlin-pinpin.org"
          git revert --no-edit HEAD >/dev/null
          {
            echo "revert_sha=$(git rev-parse HEAD)"
            echo "pin_sha=${pin_sha}"
            echo "reason=${reason}"
          } >> "$GITHUB_ENV"

      - name: Push the revert (test — direct push, the ruleset allows it)
        if: env.env_name == 'test'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/merlin-pinpin-org/kingdoms-infra.git"
          git push origin "HEAD:deploy/${{ env.env_name }}"
          echo "revert pushed to deploy/${{ env.env_name }} — the Deploy environment workflow re-applies the previous image"

      - name: Open a revert PR (prod — the ruleset requires an approved PR)
        if: env.env_name == 'prod'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASON: ${{ env.reason }}
          PIN_SHA: ${{ env.pin_sha }}
        run: |
          set -euo pipefail
          branch="vibe/rollback-${{ env.env_name }}-${GITHUB_RUN_ID}"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/merlin-pinpin-org/kingdoms-infra.git"
          git push origin "HEAD:refs/heads/${branch}"
          body_file="$(mktemp)"
          {
            echo "## Summary"
            echo "- Reverts the pin commit \`${PIN_SHA}\` on \`deploy/prod\` — the post-deploy battery or an operator reported a broken deployment."
            echo "- Reason: ${REASON}"
            echo "- After merge, the push to \`deploy/prod\` re-triggers the Deploy environment workflow and re-applies the previous known-good image. No data is touched; the DB backup remains the last-resort path if the release carried schema changes."
            echo "- The code on \`main\` is untouched: a rejected deployment rolls the pinned state back, not the source."
          } > "${body_file}"
          gh pr create \
            --repo merlin-pinpin-org/kingdoms-infra \
            --head "${branch}" \
            --base deploy/prod \
            --title "rollback(prod): revert the pin ${PIN_SHA:0:7} — ${REASON}" \
            --body-file "${body_file}" \
            --reviewer merlin-pinpin || true
