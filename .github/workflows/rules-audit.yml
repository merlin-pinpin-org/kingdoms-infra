# Branch and tag rules audit (docs/ENVIRONMENTS.md § "Branch and tag
# rules"). The expected rulesets and required status checks are documented
# as the source of truth; this workflow compares the live GitHub
# configuration against it and fails on any drift — run it on demand, after
# any ruleset change, or weekly to catch silent regressions (e.g. a ruleset
# bound to `~DEFAULT_BRANCH` silently following a default-branch change).
#
# It also fails when a deploy/* state branch drifts from main (missed
# propagation — see "Keeping the state branches current").
#
# Drift notifications (developer-mandated): a failing audit run is invisible
# to the humans who caused it, so the audit also maintains a single living
# `env-drift` labeled issue — created/commented on drift, closed when clean —
# that @mentions the drift owner. Personal env drift (envs/<alias>) notifies
# the alias's login resolved from the kingdoms roster (CONTRIBUTORS.md);
# platform-level drift notifies the maintainers team.

name: Branch and tag rules audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Compare live rulesets with the documented expectations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit the three repositories
        id: audit
        uses: actions/github-script@v7
        with:
          script: |
            const org = "merlin-pinpin-org";
            const infraChecks = [
              "Lint scripts and workflows",
              "Validate compose manifests",
              "Validate infrastructure files",
              "Backup/restore round-trip test",
              "Smoke test (test stack boot)",
              "cla",
            ];
            const servicesChecks = [
              "Lint (ruff)",
              "Typecheck (mypy strict)",
              "Unit tests (pytest)",
              "Validate and boot docker-compose.yml",
              "Smoke test (bot image + MongoDB + Redis)",
              "Discord smoke (real gateway via the CI/CD bot)",
              "Build and test the image",
              "Generate and check pydoc freshness",
              "cla",
            ];
            const kingdomsChecks = ["cla", "check"];

            const expected = {
              "kingdoms-infra": {
                "main": { rules: ["deletion", "non_fast_forward", "required_linear_history", "pull_request", "required_status_checks"], checks: infraChecks },
                "deploy/test": { rules: ["deletion", "non_fast_forward", "required_linear_history", "required_status_checks"], checks: infraChecks },
                "deploy/prod": { rules: ["deletion", "non_fast_forward", "required_linear_history", "pull_request", "required_status_checks"], checks: infraChecks },
              },
              "kingdoms-services": {
                "main": { rules: ["deletion", "non_fast_forward", "required_linear_history", "pull_request", "required_status_checks"], checks: servicesChecks },
                
              },
              "kingdoms": {
                "main": { rules: ["deletion", "non_fast_forward", "required_linear_history", "pull_request", "required_status_checks"], checks: kingdomsChecks },
              },
            };

            const problems = [];

            for (const [repo, refs] of Object.entries(expected)) {
              for (const [ref, want] of Object.entries(refs)) {
                let rules;
                try {
                  rules = (await github.rest.repos.getBranchRules({
                    owner: org,
                    repo,
                    branch: ref,
                  })).data;
                } catch (e) {
                  problems.push(`${repo}: cannot read rules for ${ref} — ${e.message}`);
                  continue;
                }
                if (rules.length === 0) {
                  problems.push(`${repo}: NO ruleset protects ${ref}`);
                  continue;
                }
                const types = rules.map((r) => r.type).sort();
                const missing = want.rules.filter((t) => !types.includes(t));
                if (missing.length > 0) {
                  problems.push(`${repo}: ${ref} is missing rules: ${missing.join(", ")}`);
                }
                if (want.checks.length > 0) {
                  const checks = rules.flatMap((r) =>
                    r.type === "required_status_checks" ? r.parameters.required_status_checks.map((c) => c.context) : []
                  );
                  const missingChecks = want.checks.filter((c) => !checks.includes(c));
                  if (missingChecks.length > 0) {
                    problems.push(`${repo}: ${ref} is missing required status checks: ${missingChecks.join(", ")}`);
                  }
                }
              }
            }

            // Tag rulesets (release tags) are not returned by getBranchRules —
            // audit them through the repo rulesets API instead.
            const expectedTags = {
              "kingdoms-services": ["deletion", "non_fast_forward"],
            };
            for (const [repo, wantRules] of Object.entries(expectedTags)) {
              const rulesets = await github.paginate(
                github.rest.repos.getRepoRulesets,
                { owner: org, repo, per_page: 100 },
              );
              // The list endpoint omits conditions (null) — fetch each ruleset
              // individually to read its ref_name patterns.
              const tagSets = [];
              for (const r of rulesets.filter((x) => x.target === "tag")) {
                const full = (await github.rest.repos.getRepoRuleset({
                  owner: org, repo, ruleset_id: r.id,
                  include_parents: false,
                })).data;
                const inc = full.conditions?.ref_name?.include || [];
                if (inc.some((pattern) => pattern.replace("refs/tags/", "").includes("v*.*.*"))) {
                  tagSets.push(full);
                }
              }
              if (tagSets.length === 0) {
                problems.push(`${repo}: NO tag ruleset protects refs/tags/v*.*.*`);
                continue;
              }
              const types = tagSets.flatMap((r) => r.rules.map((x) => x.type)).sort();
              const missing = wantRules.filter((t) => !types.includes(t));
              if (missing.length > 0) {
                problems.push(`${repo}: the v*.*.* tag ruleset is missing rules: ${missing.join(", ")}`);
              } else {
                core.info(`${repo}: the v*.*.* tag ruleset is in place`);
              }
            }

            // State branches must not drift from main (ADR-0018 propagation).
            // Environments are data: the branches are the deploy/ refs that
            // exist on kingdoms-infra.
            const infraBranches = await github.paginate(
              github.rest.repos.listBranches,
              { owner: org, repo: "kingdoms-infra", per_page: 100 },
            );
            const envNames = infraBranches
              .map((b) => b.name)
              .filter((n) => n.startsWith("deploy/"))
              .map((n) => n.slice("deploy/".length));
            // Personal environments (envs/<alias>, e.g. envs/drasah —
            // docs/GUIDES/your-test-env.md) are data too, and nothing
            // watched them: an env directory without its deploy/<name>
            // state branch (or the reverse — a state branch whose env
            // directory was removed) is drift, and so is an unprotected
            // personal state branch. test/prod are audited above.
            const { execSync } = require("child_process");
            const envDirs = execSync(
              "find envs -mindepth 1 -maxdepth 1 -type d -printf '%f\\n'",
              { cwd: process.env.GITHUB_WORKSPACE, encoding: "utf8" }
            ).trim().split("\n").filter(Boolean);
            for (const env of envDirs) {
              if (!envNames.includes(env)) {
                problems.push(`kingdoms-infra: envs/${env} exists but the deploy/${env} state branch does not — create it (docs/GUIDES/your-test-env.md, ENVIRONMENTS.md § "Keeping the state branches current")`);
              }
            }
            for (const env of envNames) {
              if (!envDirs.includes(env)) {
                problems.push(`kingdoms-infra: deploy/${env} exists but envs/${env} does not — the branch is a state record for a removed (or never created) environment`);
              }
            }
            // Every state branch — personal envs included — must carry
            // the same protections as deploy/test: deletion and
            // non-fast-forward at minimum (the templated per-env ruleset).
            for (const env of envNames) {
              const branch = `deploy/${env}`;
              let rules;
              try {
                rules = (await github.rest.repos.getBranchRules({
                  owner: org,
                  repo: "kingdoms-infra",
                  branch,
                })).data;
              } catch (e) {
                problems.push(`kingdoms-infra: cannot read rules for ${branch} — ${e.message}`);
                continue;
              }
              const types = rules.map((r) => r.type);
              const missing = ["deletion", "non_fast_forward"].filter(
                (t) => !types.includes(t)
              );
              if (rules.length === 0) {
                problems.push(`kingdoms-infra: NO ruleset protects ${branch}`);
              } else if (missing.length > 0) {
                problems.push(`kingdoms-infra: ${branch} is missing rules: ${missing.join(", ")}`);
              } else {
                core.info(`kingdoms-infra: ${branch} is protected`);
              }
            }
            for (const env of envNames) {
              const branch = `deploy/${env}`;
              try {
                const compare = await github.rest.repos.compareCommits({
                  owner: org,
                  repo: "kingdoms-infra",
                  base: "main",
                  head: branch,
                });
                const behind = compare.data.behind_by;
                if (behind > 0) {
                  problems.push(`kingdoms-infra: ${branch} is ${behind} commit(s) behind main — propagate the pipeline changes (docs/ENVIRONMENTS.md § "Keeping the state branches current")`);
                } else {
                  core.info(`kingdoms-infra: ${branch} is in sync with main`);
                }
              } catch (e) {
                problems.push(`kingdoms-infra: cannot compare main..${branch} — ${e.message}`);
              }
            }

            if (problems.length > 0) {
              core.error("The live GitHub rules have drifted from the documented configuration:");
              for (const p of problems) core.error(`- ${p}`);
              core.setFailed(`${problems.length} rule problem(s) — see the errors above`);
              core.setOutput("problems", JSON.stringify(problems));
            } else {
              core.info("All documented rulesets and required status checks are in place, and every state branch is in sync with main.");
              core.setOutput("problems", "[]");
            }

      - name: "Check out kingdoms (roster: alias to login)"
        uses: actions/checkout@v4
        with:
          repository: merlin-pinpin-org/kingdoms
          ref: main
          path: kingdoms
          sparse-checkout: CONTRIBUTORS.md
      - name: Notify the drift owners (living env-drift issue)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBLEMS: ${{ steps.audit.outputs.problems }}
        run: |
          set -euo pipefail
          gh label create env-drift --color d93f0b --description "Environment/rules drift reported by the weekly audit" --force --repo "$GITHUB_REPOSITORY" || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label env-drift --state open --json number --jq '.[0].number')
          if [ "${PROBLEMS:-[]}" = "[]" ] || [ -z "${PROBLEMS:-}" ]; then
            if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
              echo "closing env-drift issue #${existing} — the audit passes again"
              gh issue close "${existing}" --repo "$GITHUB_REPOSITORY" \
                --comment "The branch and tag rules audit passes again ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)) — closing."
            else
              echo "audit clean — no open drift issue"
            fi
            exit 0
          fi
          mentions=""
          for alias in $(printf '%s' "${PROBLEMS}" | grep -oE 'envs/[a-z0-9-]+' | sed 's|envs/||' | sort -u); do
            login=$(grep -iE "^[|] *@\S+ +\| *${alias} *\|" kingdoms/CONTRIBUTORS.md \
              | grep -oE '@[A-Za-z0-9-]+' | head -1 || true)
            [ -n "${login}" ] && mentions="${mentions} ${login}"
          done
          mentions=$(echo "${mentions} @merlin-pinpin-org/maintainers" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          cat > /tmp/env-drift-body.md <<'DRIFT_HEADER'
          ${mentions} — the weekly branch and tag rules audit found drift
          you own or are responsible for:

          DRIFT_HEADER
          printf '%s' "${PROBLEMS}" | python3 -c 'import json,sys; [print(f"- {p}") for p in json.load(sys.stdin)]' >> /tmp/env-drift-body.md
          cat >> /tmp/env-drift-body.md <<'DRIFT_FOOTER'

          The audit reports, never repairs — fix the underlying state, the
          next audit run closes this issue automatically.

          _Notified: ${mentions} (env owners resolved from the kingdoms roster, plus the maintainers as fallback owner)._
          DRIFT_FOOTER
          if [ -n "${existing}" ] && [ "${existing}" != "null" ]; then
            echo "drift issue #${existing} already open — commenting the new findings"
            gh issue comment "${existing}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/env-drift-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Environment/rules drift: live state diverged from the documented configuration" \
              --label env-drift --body-file /tmp/env-drift-body.md
          fi
