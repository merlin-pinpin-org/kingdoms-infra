# Propagate pipeline changes from main to every deploy/<env> state branch
# (ADR-0018, docs/ENVIRONMENTS.md § "Keeping the state branches current").
#
# The state branches run the deploy workflows in their own revision: a merge
# on main that touches a deploy workflow, a deploy/<env>/ manifest or
# scripts/deploy.sh keeps running in its old revision on the state branch
# until it is propagated. This workflow automates the propagation.
#
# The push uses the kingdoms-deployer App token — the same actor the deploy
# pipelines use to write the pinned state, and the only non-admin actor in
# the deploy/* ruleset bypass lists. Sync pushes carry no pipeline change,
# so the Deploy <env> workflow they trigger redeploys the unchanged pinned
# state — safe by design. The rulesets (no force-push) keep the sync
# history auditable.
#
# Single-writer design (ADR-0018): every writer to a deploy/<env> state
# branch lives in this repository and shares one concurrency group,
# deploy-state-<env> — pin-state.yml (image pins dispatched by the deploy
# pipelines), this sync workflow, and the re-pin job of deploy-test.yml.
# GitHub serializes them, so a sync can never race a pin (the historical
# "cannot lock ref" failure). Known limit: only the latest queued run of
# a group survives; a superseded sync is re-triggered by the next push to
# main.
#
# One job per environment, parameterized only by the env name: adding an
# environment is adding it to the matrix (plus its ruleset and VPS install).
name: Sync state branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    name: Sync deploy/${{ matrix.env }} with main
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-state-${{ matrix.env }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        env: [test, prod]
    steps:
      - name: Mint the kingdoms-deployer App token (state-branch writer)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KINGDOMS_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.KINGDOMS_DEPLOYER_APP_PRIVATE_KEY }}
          owner: merlin-pinpin-org
          repositories: kingdoms-infra
      - name: Configure git
        run: |
          git config --global user.name "kingdoms-deployer[bot]"
          git config --global user.email "noreply@merlin-pinpin.org"
      - uses: actions/checkout@v4
        with:
          ref: deploy/${{ matrix.env }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge origin/main into the state branch
        run: |
          set -euo pipefail
          git remote set-branches origin '*'
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "deploy/${{ matrix.env }} already contains main — nothing to sync."
            exit 0
          fi
          git merge origin/main --no-edit -m "deploy(${{ matrix.env }}): sync state branch with main"
      - name: Push the synced state branch
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/merlin-pinpin-org/kingdoms-infra.git"
          git push origin HEAD:deploy/${{ matrix.env }}
