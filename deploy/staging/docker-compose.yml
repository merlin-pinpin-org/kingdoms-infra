# Staging environment: mirrors production with staging-specific credentials.
# Secrets are injected via the .env file provisioned on the host (never committed).

services:
  kingdoms-bot:
    image: ghcr.io/merlin-pinpin/kingdoms-services:main
    pull_policy: always
    environment:
      # Secrets are injected at deploy time by the CD pipeline from the
      # GitHub environment secrets (nothing secret is stored on the VPS);
      # non-secret values have overridable defaults.
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      MONGO_URI: mongodb://kingdoms-mongo:27017
      REDIS_URI: redis://kingdoms-redis:6379
      MONGO_DB: ${MONGO_DB:-kingdoms}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      # The image HEALTHCHECK also probes /healthz; the explicit compose
      # healthcheck makes the deployment health gate (scripts/deploy.sh)
      # observable: a crash-looping bot is reported unhealthy here.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      kingdoms-mongo:
        condition: service_healthy
      kingdoms-redis:
        condition: service_healthy
    restart: unless-stopped

  kingdoms-mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kingdoms-redis:
    image: redis:7.2
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
